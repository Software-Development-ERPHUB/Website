<!DOCTYPE html>
<html lang="en" data-theme="light" data-layout="vertical">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EHS Management System · Voltech Group</title>
<meta name="description" content="Voltech Group – Environment, Health &amp; Safety Management System (single-page application)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
/* =========================================================
   Voltech EHS — single-page stylesheet (themeable)
   ========================================================= */
:root{
  --primary:#0B3B66; --accent:#F5B301; --accent-ink:#1A1A1A; --red:#C8102E;
  --primary-d:color-mix(in srgb,var(--primary) 82%,#000);
  --primary-dd:color-mix(in srgb,var(--primary) 58%,#000);
  --primary-soft:color-mix(in srgb,var(--primary) 10%,transparent);
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#F8FAFC; --input:#FFFFFF;
  --line:#E2E8F0; --line-2:#CBD5E1;
  --text:#0F172A; --text-2:#475569; --text-3:#94A3B8;
  --head:var(--primary-dd); --link:var(--primary);
  --ok:#15803D; --ok-bg:#DCFCE7; --warn:#B45309; --warn-bg:#FEF3C7;
  --bad:#B91C1C; --bad-bg:#FEE2E2; --info:#1D4ED8; --info-bg:#DBEAFE;
  --muted:#475569; --muted-bg:#E2E8F0; --crit:#7F1D1D;
  --radius:10px; --radius-sm:7px;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 1px 3px rgba(15,23,42,.07);
  --shadow-lg:0 22px 44px -14px rgba(15,23,42,.38);
  --sidebar:252px; --fs:14px; --pad:16px; --cell:10px;
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --sb-bg:linear-gradient(180deg,var(--primary) 0%,var(--primary-dd) 100%);
  --sb-text:#D6DFEA; --sb-muted:#8FA3BB; --sb-hover:rgba(255,255,255,.08); --sb-line:rgba(255,255,255,.09);
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#0B1220; --surface:#111A2B; --surface-2:#16233A; --input:#0F1828;
  --line:#22324C; --line-2:#30435F;
  --text:#E5EAF2; --text-2:#A6B4C8; --text-3:#6B7D98;
  --head:#F1F5F9; --link:color-mix(in srgb,var(--primary) 35%,#9CC3FF);
  --ok:#4ADE80; --ok-bg:rgba(34,197,94,.15); --warn:#FBBF24; --warn-bg:rgba(245,158,11,.16);
  --bad:#F87171; --bad-bg:rgba(239,68,68,.16); --info:#93C5FD; --info-bg:rgba(59,130,246,.18);
  --muted:#A6B4C8; --muted-bg:rgba(148,163,184,.16);
  --primary-soft:color-mix(in srgb,var(--primary) 30%,transparent);
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 22px 44px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
html[data-sidebar="light"]{--sb-bg:var(--surface);--sb-text:var(--text);--sb-muted:var(--text-3);--sb-hover:var(--surface-2);--sb-line:var(--line)}
html[data-density="compact"]{--fs:13px;--pad:12px;--cell:7px}
html[data-radius="sharp"]{--radius:3px;--radius-sm:2px}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);font-size:var(--fs);color:var(--text);background:var(--bg);line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--link);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.25}
svg{flex:none}
.muted{color:var(--text-2)} .small{font-size:12px} .mono{font-family:var(--mono)}
[hidden]{display:none!important}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);min-height:100vh}
.sidebar{background:var(--sb-bg);color:var(--sb-text);position:sticky;top:0;height:100vh;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;z-index:40;border-right:1px solid var(--sb-line)}
.brand{padding:16px 18px 14px;border-bottom:1px solid var(--sb-line);display:flex;flex-direction:column;gap:8px;min-height:84px;justify-content:center}
.brand a{display:flex;align-items:center}
.brand .logo{height:40px;max-width:200px;display:block}
.brand .logo-img{max-height:44px;max-width:200px;object-fit:contain;display:block}
.brand .logo-img.panel{background:#fff;padding:5px 8px;border-radius:8px}
.brand .mark{display:none;width:40px;height:40px}
.brand .tag{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{padding:8px 10px 20px;flex:1;display:flex;flex-direction:column}
.nav .group{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--sb-muted);padding:16px 10px 6px;font-weight:600;white-space:nowrap}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;color:var(--sb-text);font-size:13.5px;margin:1px 0;white-space:nowrap}
.nav a svg{width:18px;height:18px;opacity:.85}
.nav a:hover{background:var(--sb-hover)}
.nav a.active{background:var(--accent);color:var(--accent-ink);font-weight:600}
.nav a.active svg{opacity:1}
.sidebar .foot{padding:12px 18px;font-size:11px;color:var(--sb-muted);border-top:1px solid var(--sb-line);white-space:nowrap}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{height:60px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 22px;position:sticky;top:0;z-index:30}
.topbar .crumbs{font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.topbar .crumbs b{color:var(--text)}
.topbar .spacer{flex:1}
.site-select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface-2);font-size:13px;max-width:230px}
.icon-btn{position:relative;width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;cursor:pointer;flex:none;color:var(--text-2)}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn svg{width:18px;height:18px}
.icon-btn .dot{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center}
.menu-btn{display:none!important}
.user-chip{display:flex;align-items:center;gap:10px;cursor:pointer;padding:4px 8px 4px 4px;border-radius:10px;border:1px solid transparent;position:relative}
.user-chip:hover{border-color:var(--line)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.user-chip .who{line-height:1.15;white-space:nowrap}
.user-chip .who b{display:block;font-size:13px}
.user-chip .who span{font-size:11.5px;color:var(--text-2)}
.pop{position:relative}
.dropdown{position:absolute;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);width:240px;padding:6px;display:none;z-index:60;cursor:default}
.dropdown.open{display:block}
.dropdown .dd-head{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.dropdown .dd-head b{font-size:13px;display:block}
.dropdown a,.dropdown button{display:flex;width:100%;gap:10px;align-items:center;padding:8px 10px;border-radius:7px;border:0;background:none;text-align:left;cursor:pointer;color:var(--text);font-size:13px}
.dropdown a svg,.dropdown button svg{width:16px;height:16px;color:var(--text-2)}
.dropdown a:hover,.dropdown button:hover{background:var(--surface-2)}
.dropdown hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.notif{width:370px;max-height:440px;overflow:auto;padding:0}
.notif h4{padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px;position:sticky;top:0;background:var(--surface)}
.notif .item{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;font-size:12.5px;color:var(--text)}
.notif .item:hover{background:var(--surface-2)}
.notif .item .bar{width:4px;border-radius:2px;flex:none}
.notif .item small{display:block;color:var(--text-2)}
.notif .empty{padding:24px;text-align:center;color:var(--text-2)}

.content{padding:22px;width:100%;max-width:1520px}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-head .eyebrow{font-family:var(--mono);font-size:11.5px;color:var(--red);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
html[data-theme="dark"] .page-head .eyebrow{color:#FCA5A5}
.page-head h1{font-size:22px;font-weight:700;color:var(--head)}
.page-head p{margin:4px 0 0;color:var(--text-2);max-width:780px}
.page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- Buttons & forms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:var(--radius-sm);border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap;color:var(--text);line-height:1.2}
.btn:hover{background:var(--surface-2)}
.btn svg{width:16px;height:16px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-d)}
.btn-amber{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn-amber:hover{background:var(--accent);filter:brightness(.95)}
.btn-danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn-danger:hover{background:var(--bad-bg)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-ghost{border-color:transparent;background:none}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:12px;font-weight:600;color:var(--text-2)}
.field label .req{color:var(--red)}
.field label .lock{font-size:10.5px;font-weight:600;color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:0 6px;margin-left:6px}
.input,.field input,.field select,.field textarea{border:1px solid var(--line-2);border-radius:var(--radius-sm);padding:8px 10px;background:var(--input);width:100%;outline:none;font-size:13.5px;color:var(--text)}
.field textarea{min-height:76px;resize:vertical}
.input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.field input[readonly],.field textarea[readonly],.field select:disabled{background:var(--surface-2);color:var(--text-2)}
.field .hint{font-size:11.5px;color:var(--text-3)}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-2)}
.checks label{display:flex;align-items:center;gap:6px;font-weight:400;font-size:13px;color:var(--text)}
input[type=checkbox],input[type=radio]{accent-color:var(--primary);width:15px;height:15px}

/* ---------- Cards / KPIs ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:14px var(--pad);border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h3{font-size:14.5px;font-weight:600;color:var(--head)}
.card-h .sub{font-size:12px;color:var(--text-2)}
.card-h .right{margin-left:auto}
.card-b{padding:var(--pad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px var(--pad);position:relative;overflow:hidden;box-shadow:var(--shadow);color:var(--text)}
a.kpi:hover{border-color:var(--line-2);transform:translateY(-1px)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--primary)}
.kpi.ok::before{background:var(--ok)} .kpi.warn::before{background:var(--accent)} .kpi.bad::before{background:var(--bad)} .kpi.info::before{background:var(--info)}
.kpi .l{font-size:12px;color:var(--text-2);font-weight:500}
.kpi .v{font-size:26px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;color:var(--head)}
.kpi .s{font-size:11.5px;color:var(--text-3);margin-top:2px}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;scrollbar-width:thin}
.tabs a{padding:10px 14px;font-weight:500;color:var(--text-2);border-bottom:2.5px solid transparent;white-space:nowrap;font-size:13.5px;display:flex;align-items:center}
.tabs a:hover{color:var(--text)}
.tabs a.active{color:var(--link);border-bottom-color:var(--accent);font-weight:600}
.tabs a .c{font-family:var(--mono);font-size:11px;background:var(--muted-bg);color:var(--text-2);border-radius:10px;padding:1px 7px;margin-left:6px}
.tabs a.active .c{background:var(--primary);color:#fff}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--radius-sm);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 14px;cursor:pointer;font-size:13px;color:var(--text-2)}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button.on{background:var(--primary);color:#fff}

/* ---------- Toolbar & table ---------- */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.toolbar .search{position:relative;flex:1;min-width:180px;max-width:340px}
.toolbar .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-3)}
.toolbar .search input{padding-left:32px}
.toolbar .grow{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:16px;padding:4px 11px;font-size:12px;cursor:pointer;color:var(--text)}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff}
.table-wrap{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data th{text-align:left;font-weight:600;color:var(--text-2);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding:var(--cell) 12px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
table.data th .arr{opacity:.5;margin-left:3px}
table.data td{padding:var(--cell) 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.data tbody tr:hover td{background:var(--surface-2)}
table.data td.id{font-family:var(--mono);font-size:12px;font-weight:600;white-space:nowrap}
table.data td.nowrap{white-space:nowrap}
table.data td.clip{max-width:280px}
table.data td.act{white-space:nowrap;text-align:right;padding-top:calc(var(--cell) - 4px)}
table.data .empty{text-align:center;color:var(--text-2);padding:36px}
.tfoot{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:12.5px;color:var(--text-2);flex-wrap:wrap}
.tfoot .spacer{flex:1}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:12px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--muted-bg);color:var(--muted)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)} .badge.info{background:var(--info-bg);color:var(--info)}
.badge.crit{background:var(--crit);color:#fff}
.badge.plain::before{display:none}
.risk{display:inline-grid;place-items:center;min-width:30px;height:24px;border-radius:6px;font-weight:700;font-size:12px;font-family:var(--mono);padding:0 6px}
.risk.low{background:#BBF7D0;color:#14532D}.risk.med{background:#FDE68A;color:#78350F}.risk.high{background:#FDBA74;color:#7C2D12}.risk.crit{background:#DC2626;color:#fff}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(8,20,40,.5);display:none;z-index:100;align-items:flex-start;justify-content:center;padding:36px 16px;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:820px;box-shadow:var(--shadow-lg);animation:pop .14s ease-out;border:1px solid var(--line)}
@keyframes pop{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.modal-h h3{font-size:16px;color:var(--head)}
.modal-h .x{margin-left:auto}
.modal-b{padding:18px 20px;max-height:calc(100vh - 210px);overflow-y:auto}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 14px 14px;flex-wrap:wrap}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid .span2{grid-column:1/-1}
.form-sec{grid-column:1/-1;font-size:11.5px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:.08em;padding-top:8px;border-top:1px dashed var(--line);margin-top:2px}
html[data-theme="dark"] .form-sec{color:#FCA5A5}
.form-sec:first-child{border-top:0;margin-top:0;padding-top:0}
.detail{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:0}
.detail div{padding:10px 12px;border-bottom:1px solid var(--line)}
.detail div:nth-child(odd){border-right:1px solid var(--line)}
.detail .span2{grid-column:1/-1;border-right:0!important}
.detail dt{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);font-weight:600}
.detail dd{margin:3px 0 0;white-space:pre-wrap;word-break:break-word}
.timeline{margin-top:10px;border-left:2px solid var(--line);padding-left:14px;margin-left:5px}
.timeline .t{position:relative;padding:4px 0 10px;font-size:12.5px}
.timeline .t::before{content:"";position:absolute;left:-21px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line-2)}
.timeline .t small{color:var(--text-2);display:block}
.steps-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
.steps-table th,.steps-table td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.steps-table th{background:var(--surface-2);font-size:11px;text-transform:uppercase;color:var(--text-2)}
.sub-h{margin:18px 0 6px;font-size:13px;color:var(--head)}
.toast-wrap{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:200;max-width:calc(100vw - 40px)}
.toast{background:#0F1B2D;color:#fff;padding:10px 16px;border-radius:8px;box-shadow:var(--shadow-lg);font-size:13px;animation:pop .2s ease-out;border-left:4px solid var(--accent)}

/* ---------- Grids, charts ---------- */
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-32{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.mb{margin-bottom:16px}
.bars{display:flex;flex-direction:column;gap:9px}
.bars .row{display:grid;grid-template-columns:140px 1fr 40px;gap:10px;align-items:center;font-size:12.5px}
.bars .lbl{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400;font-size:12.5px}
.bars .track{display:block;height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bars .fill{display:block;height:100%;border-radius:6px}
.bars .val{text-align:right;font-family:var(--mono);font-weight:600}
.cols{display:flex;align-items:flex-end;gap:12px;height:180px;padding-top:10px}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.cols .stack{width:100%;max-width:44px;display:flex;flex-direction:column-reverse;border-radius:6px 6px 0 0;overflow:hidden;min-height:2px;background:var(--line)}
.cols .stack span{display:block}
.cols .c small{font-size:11.5px;color:var(--text-2)}
.cols .c b{font-size:12px;font-family:var(--mono)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--text-2);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donut{width:150px;height:150px;border-radius:50%;position:relative;flex:none}
.donut::after{content:"";position:absolute;inset:24px;background:var(--surface);border-radius:50%}
.donut .ctr{position:absolute;inset:0;display:grid;place-items:center;z-index:1;text-align:center;font-size:11.5px;color:var(--text-2)}
.donut .ctr b{display:block;font-size:24px;color:var(--head)}
.list{display:flex;flex-direction:column}
.list .li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start;font-size:13px;color:var(--text)}
.list .li:last-child{border-bottom:0}
.list .date{flex:none;width:46px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:4px 0;line-height:1.1}
.list .date b{display:block;font-size:17px;color:var(--link)}
.list .date small{font-size:10px;text-transform:uppercase;color:var(--red);font-weight:700}
.list .meta{color:var(--text-2);font-size:12px}
.safety-banner{background:linear-gradient(120deg,var(--primary) 0%,var(--primary-dd) 70%);color:#fff;border-radius:var(--radius);padding:18px 22px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin-bottom:16px;position:relative;overflow:hidden}
.safety-banner::after{content:"";position:absolute;right:-40px;top:-40px;width:220px;height:220px;background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--accent) 22%,transparent) 0 14px,transparent 14px 28px);border-radius:50%}
.safety-banner .big{font-size:44px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.safety-banner .lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.7);font-weight:500}
.safety-banner .sep{width:1px;align-self:stretch;background:rgba(255,255,255,.18)}
.safety-banner .stat b{font-size:22px;display:block}
.safety-banner .stat span{font-size:12px;color:rgba(255,255,255,.7)}
.matrix{display:grid;grid-template-columns:28px repeat(5,1fr);gap:4px;font-size:12px;max-width:480px}
.matrix .ax{display:grid;place-items:center;color:var(--text-2);font-weight:600;font-size:11px}
.matrix .cell{aspect-ratio:1.6;border-radius:6px;display:grid;place-items:center;font-weight:700;font-family:var(--mono);font-size:14px;position:relative;color:#1F2937}
.matrix .cell small{position:absolute;top:3px;left:5px;font-size:9.5px;opacity:.6;font-weight:500}
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cal-head h3{font-size:16px;min-width:150px;color:var(--head)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden}
.cal .dow{background:var(--surface-2);font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text-2);padding:7px;border-bottom:1px solid var(--line);text-align:center}
.cal .day{min-width:0;min-height:96px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px;font-size:11.5px;background:var(--surface)}
.cal .day:nth-child(7n){border-right:0}
.cal .day.other{background:var(--surface-2);color:var(--text-3)}
.cal .day.today .num{background:var(--accent);color:var(--accent-ink);border-radius:50%;width:22px;height:22px;display:grid;place-items:center}
.cal .num{font-weight:600;margin-bottom:3px}
.cal .ev{display:block;padding:2px 5px;border-radius:4px;margin-top:2px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}

/* ---------- Access control ---------- */
.acl-subject{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.acl-subject .field{min-width:220px}
table.acl{width:100%;border-collapse:collapse;font-size:13px}
table.acl th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-2);background:var(--surface-2);padding:8px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:1}
table.acl th:first-child,table.acl td:first-child{text-align:left}
table.acl td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
table.acl tr.grp td{background:var(--surface-2);font-weight:700;font-size:12px;color:var(--head);text-transform:uppercase;letter-spacing:.06em}
table.acl select{padding:4px 6px;border:1px solid var(--line-2);border-radius:6px;background:var(--input);font-size:12px}
table.acl select.allow{border-color:var(--ok);color:var(--ok)} table.acl select.deny{border-color:var(--bad);color:var(--bad)}
.acl-note{font-size:12px;color:var(--text-2);background:var(--info-bg);border-radius:8px;padding:9px 12px;margin-bottom:12px}
html[data-theme="dark"] .acl-note{color:var(--text)}

/* ---------- Appearance ---------- */
.opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.opt{border:1.5px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;background:var(--surface);text-align:left;color:var(--text);display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.opt:hover{border-color:var(--line-2)}
.opt.on{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.opt b{font-size:13px}
.prev{height:64px;border-radius:6px;border:1px solid var(--line);display:flex;overflow:hidden;background:var(--bg)}
.prev .ps{width:28%;background:var(--primary)} .prev .pm{flex:1;display:flex;flex-direction:column;gap:5px;padding:6px}
.prev .pt{height:12px;background:var(--primary)} .prev i{display:block;height:7px;border-radius:3px;background:var(--line-2)}
.prev.col .ps{width:12%}
.prev.hor{flex-direction:column}
.swatch{display:flex;height:30px;border-radius:6px;overflow:hidden}
.swatch span{flex:1}
.set-row{display:grid;grid-template-columns:220px 1fr;gap:18px;padding:16px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row h4{font-size:13.5px;color:var(--head)}
.set-row p{margin:4px 0 0;font-size:12px;color:var(--text-2)}
.logo-prev{display:flex;gap:12px;flex-wrap:wrap}
.logo-prev div{flex:1;min-width:200px;height:90px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line)}
.logo-prev .dk{background:var(--primary-dd)} .logo-prev .lt{background:#fff}
.logo-prev img,.logo-prev svg{max-height:52px;max-width:200px}

/* ---------- Manual ---------- */
.manual{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;align-items:start}
.manual .toc{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto;padding:12px}
.manual .toc a{display:block;padding:5px 8px;border-radius:6px;font-size:12.5px;color:var(--text-2)}
.manual .toc a:hover{background:var(--surface-2);color:var(--text)}
.manual .toc a.l2{padding-left:20px;font-size:12px}
.manual .doc{padding:26px 32px;line-height:1.6}
.manual .doc h2{font-size:20px;color:var(--head);margin:34px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
.manual .doc h2:first-of-type{margin-top:0;border-top:0;padding-top:0}
.manual .doc h3{font-size:15.5px;color:var(--head);margin:22px 0 6px}
.manual .doc h4{font-size:13.5px;margin:14px 0 4px;color:var(--text)}
.manual .doc p,.manual .doc li{color:var(--text);font-size:13.5px}
.manual .doc ol,.manual .doc ul{padding-left:22px;margin:6px 0}
.manual .doc .callout{background:var(--surface-2);border-left:4px solid var(--accent);padding:10px 14px;border-radius:6px;font-size:13px;margin:10px 0}
.manual .doc table{margin:8px 0}
.flowline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
.flowline span{background:var(--primary-soft);color:var(--link);border-radius:14px;padding:4px 11px;font-size:12px;font-weight:600}
.flowline em{color:var(--text-3);font-style:normal}

/* ---------- Login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login .hero{color:#fff;padding:44px 52px;display:flex;flex-direction:column;position:relative;overflow:hidden;background:radial-gradient(circle at 85% 18%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 45%),linear-gradient(160deg,var(--primary) 0%,var(--primary-dd) 72%)}
.login .hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;background:repeating-linear-gradient(-45deg,var(--accent) 0 16px,var(--primary-dd) 16px 32px)}
.login .hero .logo,.login .hero .logo-img{height:52px;max-width:260px;object-fit:contain;align-self:flex-start}
.login .hero .logo-img.panel{background:#fff;padding:6px 10px;border-radius:10px;height:60px}
.login .hero h1{font-size:36px;font-weight:700;margin-top:auto;max-width:520px;line-height:1.15}
.login .hero h1 em{font-style:normal;color:var(--accent)}
.login .hero p{color:rgba(255,255,255,.75);max-width:500px;font-size:15px;margin:14px 0 0}
.login .flow{display:flex;flex-wrap:wrap;gap:6px;margin:26px 0 40px;max-width:560px}
.login .flow span{font-size:11.5px;border:1px solid rgba(255,255,255,.22);border-radius:16px;padding:4px 11px;color:rgba(255,255,255,.88)}
.login .panel{display:flex;align-items:center;justify-content:center;padding:40px 24px;background:var(--surface)}
.login .box{width:100%;max-width:380px}
.login .mob-logo{display:none;margin-bottom:24px}
.login .mob-logo .logo,.login .mob-logo .logo-img{height:44px;max-width:220px;object-fit:contain}
.login h2{font-size:24px;color:var(--head)}
.login .sub{color:var(--text-2);margin:6px 0 24px}
.login form{display:flex;flex-direction:column;gap:14px}
.login .pw{position:relative}
.login .pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--text-2);cursor:pointer;font-size:12px;font-weight:600}
.login .row{display:flex;align-items:center;justify-content:space-between;font-size:13px}
.login .row label{display:flex;gap:6px;align-items:center;font-weight:400;color:var(--text)}
.login .btn-primary{padding:11px;font-size:14px}
.msg{border-radius:8px;padding:9px 12px;font-size:13px}
.msg.err{background:var(--bad-bg);color:var(--bad)} .msg.ok{background:var(--ok-bg);color:var(--ok)}
.demo{margin-top:26px;border:1px dashed var(--line-2);border-radius:10px;padding:12px 14px;font-size:12.5px}
.demo b{display:block;margin-bottom:6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-2)}
.demo button{display:flex;justify-content:space-between;gap:8px;width:100%;border:0;background:none;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--text)}
.demo button:hover{background:var(--surface-2)}
.demo button span{color:var(--text-2);font-family:var(--mono);font-size:11.5px}
.login .legal{margin-top:24px;font-size:11.5px;color:var(--text-3);text-align:center}

/* ---------- Layout: collapsed sidebar ---------- */
@media (min-width:901px){
  html[data-layout="collapsed"]{--sidebar:72px}
  html[data-layout="collapsed"] .brand{padding:16px 0;align-items:center}
  html[data-layout="collapsed"] .brand .logo,html[data-layout="collapsed"] .brand .tag{display:none}
  html[data-layout="collapsed"] .brand .mark{display:block}
  html[data-layout="collapsed"] .brand .logo-img{max-width:48px;max-height:40px}
  html[data-layout="collapsed"] .nav{padding:8px 12px}
  html[data-layout="collapsed"] .nav .group{font-size:0;padding:8px 0;margin:6px 4px;border-top:1px solid var(--sb-line)}
  html[data-layout="collapsed"] .nav a{justify-content:center;padding:10px 0}
  html[data-layout="collapsed"] .nav a span{display:none}
  html[data-layout="collapsed"] .sidebar .foot{display:none}

  /* ---------- Layout: horizontal top menu ---------- */
  html[data-layout="horizontal"] .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  html[data-layout="horizontal"] .sidebar{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;overflow:visible;border-right:0;z-index:45}
  html[data-layout="horizontal"] .brand{flex-direction:row;align-items:center;border-bottom:0;border-right:1px solid var(--sb-line);min-height:0;padding:10px 18px;gap:12px}
  html[data-layout="horizontal"] .brand .logo{height:32px}
  html[data-layout="horizontal"] .brand .logo-img{max-height:34px}
  html[data-layout="horizontal"] .brand .tag{display:none}
  html[data-layout="horizontal"] .nav{flex-direction:row;padding:0 8px;overflow-x:auto;align-items:center;gap:2px;scrollbar-width:thin}
  html[data-layout="horizontal"] .nav .group{display:none}
  html[data-layout="horizontal"] .nav a{padding:9px 11px;font-size:13px}
  html[data-layout="horizontal"] .nav a svg{width:16px;height:16px}
  html[data-layout="horizontal"] .sidebar .foot{display:none}
  html[data-layout="horizontal"] .topbar{top:62px}
  html[data-layout="horizontal"] #collapseBtn{display:none}
  html[data-layout="horizontal"] .manual .toc{top:136px}
}

/* ---------- Responsive ---------- */
@media (max-width:1100px){.g-3{grid-template-columns:1fr 1fr}.g-32{grid-template-columns:minmax(0,1fr)}.manual{grid-template-columns:1fr}.manual .toc{position:static;max-height:none}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:260px;transform:translateX(-100%);transition:transform .2s}
  .sidebar.open{transform:none;box-shadow:var(--shadow-lg)}
  .menu-btn{display:inline-grid!important}
  #collapseBtn{display:none}
  .user-chip .who{display:none}
  .login{grid-template-columns:1fr}
  .login .hero{display:none}
  .login .mob-logo{display:block}
  .set-row{grid-template-columns:1fr;gap:10px}
}
@media (max-width:640px){
  .content{padding:16px}
  .topbar{padding:0 12px;gap:8px}
  .site-select{display:none}
  .g-2,.g-3{grid-template-columns:1fr}
  .form-grid,.detail{grid-template-columns:1fr}
  .detail div{border-right:0!important}
  .bars .row{grid-template-columns:100px 1fr 34px}
  .notif{width:calc(100vw - 24px);right:-96px}
  .cal .day{min-height:60px}
  .cal .ev{font-size:0;height:6px;padding:0}
  .page-head .actions{margin-left:0}
  .manual .doc{padding:18px}
}
@media print{
  .sidebar,.topbar,.toolbar,.tabs,.page-head .actions,.act,.manual .toc,.chips{display:none!important}
  .app{display:block}.content{padding:0}
  .manual{display:block}.card{box-shadow:none}
}

.manual .doc [id]{scroll-margin-top:80px}
html[data-layout="horizontal"] .manual .doc [id]{scroll-margin-top:140px}
.modal:has(.acl-subject) .modal-b{max-height:calc(100vh - 300px)}
@media (min-width:901px){
  html[data-layout="horizontal"] .topbar{position:static}
  html[data-layout="horizontal"] .nav a{gap:6px;padding:8px 10px}
  html[data-layout="horizontal"] .manual .toc{top:76px}
}
@media (min-width:901px) and (max-width:1500px){html[data-layout="horizontal"] .nav a svg{display:none}}
.modal-h svg{width:18px;height:18px;vertical-align:-3px;margin-right:4px}
.modal table.acl th{position:static}
.nav a .s{display:none}
@media (min-width:901px){
  html[data-layout="horizontal"] .nav a .l{display:none}
  html[data-layout="horizontal"] .nav a .s{display:inline}
}

<body>
<noscript><p style="padding:24px">Please enable JavaScript to use the EHS Management System.</p></noscript>
<script>
/* ===== app.js ===== */
/* =========================================================
   Voltech EHS — core engine (single-page)
   Routing · auth · branding · appearance · access control
   · generic module renderer (KPIs, tabs, table, forms, workflow)
   ========================================================= */
(function () {
  'use strict';
  const EHS = (window.EHS = window.EHS || {});
  EHS.MODULES = EHS.MODULES || {};
  const STORE_PREFIX = 'voltech_ehs_v2_';

  /* ---------------- utilities ---------------- */
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = (n) => String(n).padStart(2, '0');
  const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const today = () => iso(new Date());
  const D = (off = 0) => { const d = new Date(); d.setDate(d.getDate() + off); return iso(d); };
  const DT = (offH = 0) => { const d = new Date(); d.setMinutes(0); d.setHours(d.getHours() + offH); return `${iso(d)}T${pad(d.getHours())}:00`; };
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const fmtDate = (v) => {
    if (!v) return '—';
    const s = String(v); const d = new Date(s.length === 10 ? s + 'T00:00:00' : s);
    if (isNaN(d)) return esc(s);
    const base = `${pad(d.getDate())} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
    return s.includes('T') ? `${base}, ${pad(d.getHours())}:${pad(d.getMinutes())}` : base;
  };
  const daysUntil = (v) => { if (!v) return null; const a = new Date(String(v).slice(0, 10) + 'T00:00:00'); const b = new Date(today() + 'T00:00:00'); return Math.round((a - b) / 86400000); };
  const num = (v) => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
  const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
  const count = (rows, fn) => rows.filter(fn).length;
  Object.assign(EHS, { $, $$, esc, D, DT, today, fmtDate, daysUntil, num, pct, count, MONTHS, iso });

  /* ---------------- storage ---------------- */
  const mem = {};
  const sGet = (k) => { try { const v = localStorage.getItem(STORE_PREFIX + k); return v == null ? mem[k] : JSON.parse(v); } catch (e) { return mem[k]; } };
  const sSet = (k, v) => { mem[k] = v; try { v == null ? localStorage.removeItem(STORE_PREFIX + k) : localStorage.setItem(STORE_PREFIX + k, JSON.stringify(v)); return true; } catch (e) { return false; } };
  const sesGet = (k) => { try { const v = sessionStorage.getItem(STORE_PREFIX + k); return v ? JSON.parse(v) : mem['s_' + k]; } catch (e) { return mem['s_' + k]; } };
  const sesSet = (k, v) => { mem['s_' + k] = v; try { v == null ? sessionStorage.removeItem(STORE_PREFIX + k) : sessionStorage.setItem(STORE_PREFIX + k, JSON.stringify(v)); } catch (e) { } };
  EHS.store = { get: sGet, set: sSet };
  EHS.settings = () => Object.assign({ manHours: 1250000, targetLTIFR: 0.5, fyStart: 4 }, sGet('settings') || {});
  EHS.saveSettings = (s) => sSet('settings', Object.assign(EHS.settings(), s));
  EHS.resetData = (keepBrand) => {
    const brand = sGet('brand');
    try { Object.keys(localStorage).filter((k) => k.startsWith(STORE_PREFIX) && !k.includes('ui_')).forEach((k) => localStorage.removeItem(k)); } catch (e) { }
    Object.keys(mem).forEach((k) => { if (!k.startsWith('s_') && !k.startsWith('ui_')) delete mem[k]; });
    if (keepBrand && brand) sSet('brand', brand);
  };

  /* ---------------- data access ---------------- */
  EHS.tab = (mod, tab) => { const m = EHS.MODULES[mod]; return m && m.tabs.find((t) => t.id === tab); };
  EHS.raw = (mod, tab) => {
    const key = `data_${mod}_${tab}`; let rows = sGet(key);
    if (!rows) { const t = EHS.tab(mod, tab); rows = t && t.seed ? (typeof t.seed === 'function' ? t.seed() : t.seed) : []; rows = rows.map((r) => Object.assign({ _h: [{ at: new Date().toISOString(), by: 'System', a: 'Record imported' }] }, r)); sSet(key, rows); }
    return rows;
  };
  EHS.save = (mod, tab, rows) => sSet(`data_${mod}_${tab}`, rows);
  EHS.rows = (mod, tab, opts = {}) => {
    const t = EHS.tab(mod, tab); if (!t) return [];
    const site = opts.allSites ? '' : EHS.currentSite();
    return EHS.raw(mod, tab).filter((r) => !site || !('site' in r) || !r.site || r.site === site).map((r) => (t.compute ? Object.assign({}, r, t.compute(r)) : Object.assign({}, r)));
  };
  EHS.refs = (mod, tab, labelKey) => () => EHS.raw(mod, tab).map((r) => ({ v: r.id, l: `${r.id} — ${String(r[labelKey] || '').slice(0, 60)}` }));
  EHS.lookup = (mod, tab, id) => EHS.raw(mod, tab).find((r) => r.id === id);

  /* ---------------- masters ---------------- */
  EHS.SITES = ['Corporate Office – Chennai', 'Manufacturing Unit – Sriperumbudur', 'Fabrication Shop – Oragadam', 'Substation Projects – Field', 'Warehouse – Ambattur'];
  EHS.DEPTS = ['Production', 'Fabrication', 'Maintenance', 'Quality', 'Stores & Logistics', 'Projects', 'Electrical', 'Admin & HR', 'EHS', 'IT'];
  EHS.ROLES = ['Administrator', 'EHS Manager', 'Safety Officer', 'Department Head', 'Employee', 'Contractor Supervisor'];
  EHS.currentSite = () => sGet('site') || '';

  /* ---------------- forms ---------------- */
  function fieldHTML(f, vals, acc) {

  function readForm(form, T, base, accOf) {

  EHS.nextId = (mod, tab) => {

  EHS.editRecord = function (mod, tab, id, preset) {

    if (!existing && T.fields.some((f) => f.k === 'site') && !vals.site && EHS.currentSite()) vals.site = EHS.currentSite();

    const all = E.raw('audits', 'findings'); const u = E.user() || {};
    nc.forEach((s) => {

(function (E) {

    if (period === 'month') return d.slice(0, 7) === E.today().slice(0, 7);
    if (period === 'quarter') { const q = new Date(now); q.setMonth(q.getMonth() - 3); return d >= E.iso(q); }
    if (period === 'fy') return d >= E.ehsStats().fyStart;
    return true;
  }

  E.renderReports = function (root) {

    const inc = all('incidents', 'report').filter((r) => inPeriod(r.when));
    const permits = all('permits', 'register').filter((r) => inPeriod(r.validFrom));
    const sched = all('training', 'schedule').filter((r) => inPeriod(r.date));
    const insp = all('audits', 'inspections').filter((r) => inPeriod(r.date));
    const findings = all('audits', 'findings');
    const legal = all('legal', 'register');
    const drills = all('events', 'drills').filter((r) => inPeriod(r.date) && r.rating !== 'Planned');
    const st = E.ehsStats();

    const rows = sites.map((s) => {
      const f = (arr) => arr.filter((r) => r.site === s);
      const lg = f(legal);
      return {
        site: s, inc: f(inc).length, nm: E.count(f(inc), (r) => r.type === 'Near Miss'), inj: E.count(f(inc), (r) => INJ.includes(r.type)), lti: E.count(f(inc), (r) => r.type === 'Lost Time Injury'),
        days: f(inc).reduce((t, r) => t + E.num(r.daysLost), 0), permits: f(permits).length, training: E.count(f(sched), (r) => r.status === 'Completed'),
        insp: f(insp).length, open: E.count(f(findings), (r) => r.status !== 'Closed'), comp: lg.length ? E.pct(E.count(lg, (r) => r.status === 'Compliant'), lg.length) + '%' : '—', drills: f(drills).length,
      };
    });
    const tot = rows.reduce((t, r) => { ['inc', 'nm', 'inj', 'lti', 'days', 'permits', 'training', 'insp', 'open', 'drills'].forEach((k) => (t[k] = (t[k] || 0) + r[k])); return t; }, {});

        </div></div>
      </div>`;
    root.querySelector('#period').onchange = (e) => { period = e.target.value; E.renderReports(root); };
    root.querySelector('#misCsv').onclick = () => {

      const keys = ['site', 'inc', 'nm', 'inj', 'lti', 'days', 'permits', 'training', 'insp', 'drills', 'open', 'comp'];

      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = `Voltech_EHS_MIS_${E.today()}.csv`; document.body.appendChild(a); a.click(); a.remove();
