<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AttendPay</title>
<meta name="description" content="AttendPay — Attendance & Payroll Management (demo)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b1f33'/%3E%3Ctext x='32' y='44' font-family='Arial' font-weight='700' font-size='34' text-anchor='middle' fill='white'%3EV%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f3f5f9;--card:#fff;--soft:#f8fafc;--hover:#f1f5f9;--ink:#0f172a;--ink2:#334155;--muted:#64748b;--line:#e3e8f0;--brand:#0f766e;--brand2:#14b8a6;--side:#0b1f33;--side-ink:#cbd5e1;--side-hover:#13304d;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#2563eb;--r:12px;--shadow:0 1px 2px rgba(15,23,42,.04),0 2px 6px rgba(15,23,42,.05);--ai1:#14b8a6;--ai2:#6366f1;color-scheme:light}
[data-theme=dark]{--bg:#0a111e;--card:#111a2b;--soft:#152036;--hover:#1a2740;--ink:#e6ebf2;--ink2:#cbd5e1;--muted:#8b9ab1;--line:#22314b;--brand:#14b8a6;--side:#060c17;--side-hover:#13233a;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
a{color:var(--brand)}
button{font:inherit}
code{background:var(--hover);padding:1px 5px;border-radius:5px;font-size:12px}
/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
#side{width:248px;background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;transition:width .18s;z-index:41}
.brand{padding:16px 18px;display:flex;gap:10px;align-items:center;color:#fff;font-weight:700;font-size:16px;min-height:64px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--brand2),#0ea5e9);display:grid;place-items:center;font-weight:800;color:#fff;flex-shrink:0}
.logo-plate{display:inline-flex;align-items:center;justify-content:center;background:#fff;border-radius:8px;padding:5px 9px;height:38px;flex-shrink:0;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.logo-plate img{max-height:28px;max-width:120px;display:block}
.logo-plate .wm{display:none;font-weight:800;letter-spacing:.14em;color:#0b1f33;font-size:13px}
.logo-plate.nologo .wm{display:block}
.logo-plate.side{height:auto;padding:8px 12px;width:100%;justify-content:center}.logo-plate.side img{max-height:44px;max-width:100%}
body.side-mini .logo-plate.side{padding:4px}
.logo-plate.blend{background:none;box-shadow:none;padding:0;height:auto;justify-content:flex-start}.logo-plate.blend img{mix-blend-mode:multiply;max-height:64px;max-width:260px}.logo-plate.blend .wm{font-size:24px;color:#0b1f33}
.login-logo{margin-bottom:28px}
.login-form{--card:#fff;--soft:#f8fafc;--hover:#f1f5f9;--ink:#0f172a;--ink2:#334155;--muted:#64748b;--line:#e3e8f0;--brand:#0f766e;background:#fff;color:var(--ink);color-scheme:light}
.logo-plate.lg{height:56px;padding:8px 14px}.logo-plate.lg img{max-height:40px;max-width:180px}.logo-plate.lg .wm{font-size:18px}
body.side-mini .logo-plate img{max-width:38px}body.side-mini .logo-plate .wm{font-size:9px;letter-spacing:0}
svg.i.sm{width:15px;height:15px}svg.i.accent{color:var(--ai2)}
.ai-av svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;width:16px;height:16px}svg.i.ok{color:var(--ok)}
.btn svg.i{width:15px;height:15px;vertical-align:-2px}
.insight .ic svg.i{width:18px;height:18px}.insight.lvl-bad .ic{color:var(--bad)}.insight.lvl-warn .ic{color:var(--warn)}.insight.lvl-info .ic{color:var(--info)}
.dd-item .ic svg.i{width:17px;height:17px;color:var(--muted)}
.ph-nav svg.i{width:20px;height:20px;margin-bottom:2px}
.feat svg.i{width:16px;height:16px;margin-right:4px;color:#99f6e4}
.toc svg.i{width:15px;height:15px;color:var(--muted);margin-top:2px}.msec h2 svg.i{width:20px;height:20px;color:var(--brand)}
.brand small{display:block;font-weight:500;color:#94a3b8;font-size:11px}
#nav .sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#64748b;padding:14px 22px 4px;white-space:nowrap}
#nav a{display:flex;align-items:center;gap:11px;padding:9px 13px;margin:2px 10px;border-radius:9px;color:var(--side-ink);text-decoration:none;cursor:pointer;white-space:nowrap}
#nav a:hover{background:var(--side-hover);color:#fff}
#nav a.active{background:var(--brand);color:#fff}
#nav a .tag{margin-left:auto;font-size:10px;background:linear-gradient(135deg,var(--ai1),var(--ai2));color:#fff;padding:1px 7px;border-radius:999px}
svg.i{width:18px;height:18px;vertical-align:-3px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side-foot{margin-top:auto;padding:14px 18px;border-top:1px solid rgba(255,255,255,.06);font-size:11px;color:#64748b}
body.side-mini #side{width:72px}
body.side-mini #nav .sec,body.side-mini #nav .lbl,body.side-mini #nav .tag,body.side-mini .brand .bt,body.side-mini .side-foot{display:none}
body.side-mini #nav a{justify-content:center;padding:10px}
.content{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:62px;display:flex;align-items:center;gap:8px;padding:0 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.top .sp{flex:1}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--ink2);display:grid;place-items:center;cursor:pointer;position:relative;flex-shrink:0}
.icon-btn:hover{background:var(--hover)}
.icon-btn svg{width:20px;height:20px}
.count{position:absolute;top:3px;right:3px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--card)}
.search{position:relative;flex:0 1 400px}
.search input{width:100%;padding:9px 60px 9px 36px;background:var(--soft);border:1px solid var(--line);border-radius:10px}
.search>svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--card)}
.dd-wrap{position:relative}
.dropdown{display:none;position:absolute;top:calc(100% + 8px);left:0;min-width:320px;max-width:92vw;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 36px rgba(15,23,42,.18);z-index:35;overflow:hidden}
.dropdown.open{display:block}
.dropdown.right{left:auto;right:0}
.dd-head{padding:11px 14px;font-weight:600;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.dd-list{max-height:380px;overflow:auto}
.dd-item{display:flex;gap:10px;padding:10px 14px;cursor:pointer;align-items:flex-start;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:13px}
.dd-item:last-child{border-bottom:none}
.dd-item:hover,.dd-item.sel{background:var(--hover)}
.dd-item .ic{width:22px;text-align:center;flex-shrink:0}
.dd-item small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.dd-label{padding:8px 14px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.user-btn{display:flex;align-items:center;gap:9px;border:none;background:transparent;cursor:pointer;padding:4px 8px 4px 4px;border-radius:12px;color:var(--ink);text-align:left}
.user-btn:hover{background:var(--hover)}
.user-btn b{display:block;font-size:13px;line-height:1.2}
.user-btn small{color:var(--muted);font-size:11.5px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--brand2),#0ea5e9);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0}
.avatar.lg{width:64px;height:64px;font-size:22px}
.page-head{display:flex;align-items:flex-end;gap:12px;padding:20px 24px 0;flex-wrap:wrap}
.page-head h1{margin:3px 0 2px;font-size:22px;letter-spacing:-.01em}
.page-head p{margin:0;color:var(--muted);font-size:13px}
.page-head .grow{flex:1;min-width:220px}
.crumbs{font-size:12px;color:var(--muted)}
.crumbs a{color:var(--muted);text-decoration:none;cursor:pointer}
.crumbs a:hover{color:var(--brand)}
.ph-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
main{padding:18px 24px 32px;flex:1}
.foot{padding:14px 24px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}
.foot a{color:var(--muted);cursor:pointer}
.side-backdrop{display:none}
/* ---------- components ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:9px;cursor:pointer;font-size:13px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--muted);background:var(--hover)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{filter:brightness(.93)}
.btn.ai{background:linear-gradient(135deg,var(--ai1),var(--ai2));border-color:transparent;color:#fff}
.btn.ai:hover{filter:brightness(.95)}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.block{width:100%;justify-content:center;padding:11px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ai-mini{padding:3px 7px;font-size:12px;border-color:transparent;background:rgba(99,102,241,.1);color:#4f46e5}
[data-theme=dark] .ai-mini{color:#a5b4fc}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi .l{color:var(--muted);font-size:12px}
.kpi .v{font-size:24px;font-weight:700;margin-top:4px;letter-spacing:-.01em}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi{border-left:4px solid var(--brand)}
.c2{grid-template-columns:2fr 1fr}.c11{grid-template-columns:1fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .sp{flex:1}
input,select,textarea{font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(20,184,166,.35);border-color:var(--brand2)}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--soft);font-weight:600;color:var(--ink2);position:sticky;top:0;z-index:1}
tr:hover td{background:var(--hover)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tfoot td{font-weight:700;background:var(--soft)}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--hover);color:var(--ink2)}
.b-ok{background:rgba(22,163,74,.13);color:#15803d}.b-warn{background:rgba(217,119,6,.15);color:#b45309}.b-bad{background:rgba(220,38,38,.12);color:#b91c1c}.b-info{background:rgba(37,99,235,.12);color:#1d4ed8}.b-mute{background:var(--hover);color:var(--muted)}.b-pur{background:rgba(147,51,234,.12);color:#7e22ce}
[data-theme=dark] .b-ok{color:#4ade80}[data-theme=dark] .b-warn{color:#fbbf24}[data-theme=dark] .b-bad{color:#f87171}[data-theme=dark] .b-info{color:#60a5fa}[data-theme=dark] .b-pur{color:#c084fc}
.muted{color:var(--muted)}.small{font-size:12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs a{padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);font-weight:500}
.tabs a.on{color:var(--brand);border-color:var(--brand)}
.reg td,.reg th{padding:5px 4px;text-align:center;font-size:11.5px}
.reg td:first-child,.reg th:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:2}
.cell-P{color:#15803d;background:rgba(22,163,74,.08)}.cell-A,.cell-LOP{color:#b91c1c;background:rgba(220,38,38,.09)}.cell-L{color:#1d4ed8;background:rgba(37,99,235,.08)}.cell-HD,.cell-MP{color:#b45309;background:rgba(217,119,6,.1)}.cell-WO,.cell-H{color:var(--muted);background:var(--soft)}.cell-WW,.cell-HW{color:#7e22ce;background:rgba(147,51,234,.08)}
[data-theme=dark] .cell-P{color:#4ade80}[data-theme=dark] .cell-A,[data-theme=dark] .cell-LOP{color:#f87171}[data-theme=dark] .cell-L{color:#60a5fa}[data-theme=dark] .cell-HD,[data-theme=dark] .cell-MP{color:#fbbf24}[data-theme=dark] .cell-WW,[data-theme=dark] .cell-HW{color:#c084fc}
.modal{position:fixed;inset:0;background:rgba(2,6,23,.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:60;overflow:auto}
.modal.hidden{display:none}
.mbox{background:var(--card);border-radius:14px;width:min(760px,100%);padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.3);border:1px solid var(--line)}
.mbox h2{margin:0 0 14px;font-size:17px;display:flex;align-items:center;gap:6px}
.mbox h2 .sp{flex:1}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2);font-weight:500}
.form .full{grid-column:1/-1}
.chk{flex-direction:row!important;align-items:center;gap:8px!important;display:inline-flex;cursor:pointer}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,10px);background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;z-index:70;pointer-events:none;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dev{display:flex;flex-direction:column;gap:6px}
.dev .nm{font-weight:600;font-size:15px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12.5px}
.kv span:nth-child(odd){color:var(--muted)}
.kv span{overflow-wrap:anywhere;min-width:0}
pre.code{background:#0b1220;color:#e2e8f0;padding:12px;border-radius:8px;overflow:auto;font-size:12px;max-height:60vh;border:1px solid var(--line)}
.note{background:rgba(20,184,166,.08);border:1px solid rgba(20,184,166,.3);color:var(--ink2);padding:10px 12px;border-radius:10px;font-size:12.5px;margin-bottom:14px}
.warnbox{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.35)}
.chart-box{position:relative;height:260px}
.list-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.list-row:last-child{border:none}
.insight{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;margin-bottom:6px;background:var(--soft);border:1px solid var(--line);font-size:13px}
.insight>div{flex:1}
.insight .ic{font-size:16px}
.insight.lvl-bad{border-left:3px solid var(--bad)}.insight.lvl-warn{border-left:3px solid var(--warn)}.insight.lvl-info{border-left:3px solid var(--info)}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qa .btn{justify-content:flex-start;padding:10px;white-space:normal;text-align:left}
.ai-spark{background:linear-gradient(135deg,var(--ai1),var(--ai2));-webkit-background-clip:text;background-clip:text;color:transparent}
.empty{text-align:center;padding:60px 20px}
.empty .big{font-size:64px;font-weight:800;color:var(--line);letter-spacing:-.03em}
/* payslip */
.slip{border:1px solid var(--line);border-radius:8px;padding:18px;font-size:12.5px;background:var(--card)}
.slip .hd{display:flex;justify-content:space-between;border-bottom:2px solid var(--brand);padding-bottom:10px;margin-bottom:10px;gap:10px}
.slip .co{font-size:17px;font-weight:700;color:var(--brand)}
.slip table td,.slip table th{padding:5px 8px;font-size:12.5px}
.slip .two{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line)}
.slip .two>div:first-child{border-right:1px solid var(--line)}
.slip .net{margin-top:12px;background:rgba(20,184,166,.08);border:1px solid rgba(20,184,166,.3);border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.slip .net b{font-size:18px}
/* phone (ESS) */
.phone-wrap{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
.phone{width:370px;max-width:100%;height:720px;border:10px solid #0f172a;border-radius:38px;overflow:hidden;display:flex;flex-direction:column;background:var(--soft);box-shadow:0 20px 40px rgba(15,23,42,.2)}
.ph-top{background:linear-gradient(135deg,#0f766e,#0e7490);color:#fff;padding:18px 16px 16px}
.ph-body{flex:1;overflow:auto;padding:12px}
.ph-nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line)}
.ph-nav a{text-align:center;padding:10px 0 12px;font-size:11px;color:var(--muted);cursor:pointer}
.ph-nav a.on{color:var(--brand);font-weight:700}
.ph-card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;border:1px solid var(--line)}
.punch{width:150px;height:150px;border-radius:50%;border:none;color:#fff;font-size:17px;font-weight:700;cursor:pointer;margin:10px auto;display:block;box-shadow:0 10px 25px rgba(15,118,110,.35)}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{background:var(--soft);border-radius:10px;padding:8px;text-align:center}
.chip b{display:block;font-size:17px}
/* ---------- login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;background:var(--card)}
.login-art{background:radial-gradient(circle at 85% 15%,rgba(20,184,166,.35),transparent 45%),radial-gradient(circle at 10% 90%,rgba(99,102,241,.35),transparent 45%),linear-gradient(150deg,#0b1f33 0%,#0d3b4a 55%,#0f5f5a 100%);color:#cbd5e1;padding:44px 52px;display:flex;flex-direction:column;justify-content:space-between;gap:30px}
.login-art .brand{padding:0;font-size:18px}
.login-art h2{font-size:36px;line-height:1.12;margin:0 0 14px;color:#fff;max-width:480px;letter-spacing:-.02em}
.login-art p{max-width:460px;line-height:1.6;margin:0 0 22px}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:520px}
.feat div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px 14px;font-size:13px;color:#e2e8f0}
.mock{max-width:520px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mock div{background:rgba(255,255,255,.06);border-radius:10px;padding:10px}
.mock b{display:block;color:#fff;font-size:20px}
.mock small{font-size:11px;color:#94a3b8}
.login-form{display:flex;align-items:center;justify-content:center;padding:40px 24px}
.login-box{width:min(410px,100%)}
.login-box h1{font-size:26px;margin:0 0 6px;letter-spacing:-.02em}
.login-box>p{margin:0 0 22px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;font-size:13px;font-weight:500;color:var(--ink2)}
.field input{padding:11px 12px;font-size:14px;width:100%}
.pw{position:relative}
.pw input{padding-right:64px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%)}
.row-between{display:flex;justify-content:space-between;align-items:center;margin:2px 0 18px;font-size:13px;gap:10px;flex-wrap:wrap}
.login-err,.login-msg{padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none}
.login-err{background:rgba(220,38,38,.1);color:#b91c1c;border:1px solid rgba(220,38,38,.25)}
.login-msg{background:rgba(20,184,166,.1);color:var(--ink2);border:1px solid rgba(20,184,166,.3)}
.login-err.show,.login-msg.show{display:block}
.demo{margin-top:26px;border-top:1px solid var(--line);padding-top:16px}
.demo-h{font-size:12px;color:var(--muted);margin-bottom:8px}
.demo-users{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.demo-users button{text-align:left;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--ink);font-size:12px}
.demo-users button:hover{border-color:var(--brand2)}
.demo-users b{display:block;font-size:12.5px}
.mobile-only{display:none}
/* ---------- AI ---------- */
#ai-fab{position:fixed;right:22px;bottom:22px;height:52px;padding:0 18px 0 14px;border-radius:26px;border:none;background:linear-gradient(135deg,var(--ai1),var(--ai2));color:#fff;box-shadow:0 10px 24px rgba(79,70,229,.35);cursor:pointer;z-index:45;display:flex;align-items:center;gap:8px;font-weight:600}
#ai-fab svg{width:22px;height:22px}
#ai-fab:hover{transform:translateY(-1px)}
body.side-open #ai-fab{visibility:hidden}
.ai-drawer{position:fixed;top:0;right:0;height:100vh;height:100dvh;width:min(430px,100vw);background:var(--card);border-left:1px solid var(--line);box-shadow:-14px 0 36px rgba(15,23,42,.16);z-index:50;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .22s;visibility:hidden}
.ai-drawer.open{transform:none;visibility:visible}
.ai-head{padding:12px 12px 12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,rgba(20,184,166,.1),rgba(99,102,241,.12))}
.ai-head b{display:block;font-size:14.5px}
.ai-head small{color:var(--muted);font-size:11.5px}
.ai-head .sp{flex:1}
.ai-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--ai1),var(--ai2));flex-shrink:0;display:grid;place-items:center;color:#fff}
.ai-av svg{width:16px;height:16px}
.ai-chat{display:flex;flex-direction:column;flex:1;min-height:0}
.ai-msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:8px;max-width:100%}
.msg.user{justify-content:flex-end}
.bubble{padding:10px 12px;font-size:13.5px;line-height:1.55;overflow-wrap:anywhere;min-width:0}
.msg.user .bubble{background:var(--brand);color:#fff;border-radius:14px 14px 4px 14px;max-width:85%;white-space:pre-wrap}
.msg.ai .bubble{background:var(--soft);border:1px solid var(--line);border-radius:4px 14px 14px 14px;max-width:calc(100% - 38px)}
.bubble p{margin:0 0 6px}.bubble ul,.bubble ol{margin:6px 0;padding-left:20px}.bubble li{margin:3px 0}
.bubble .tbl-wrap{margin:8px 0;max-height:280px}
.bubble th,.bubble td{padding:5px 8px;font-size:12px}
.ai-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.ai-btns .btn{font-size:12px;padding:5px 10px;white-space:normal;text-align:left}
.confirm{margin-top:10px;border:1px dashed var(--brand2);border-radius:10px;padding:10px;background:var(--card)}
.confirm .t{font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.ai-kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:8px 0;font-size:12.5px}
.ai-kv span:nth-child(odd){color:var(--muted)}
.ai-warn{margin:8px 0 0;padding:8px 10px 8px 26px;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);border-radius:8px;font-size:12.5px}
.ai-chips{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;border-top:1px solid var(--line);scrollbar-width:thin}
.ai-chips button{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 11px;font-size:12px;cursor:pointer;color:var(--ink2)}
.ai-chips button:hover{border-color:var(--ai2);color:var(--ai2)}
.ai-input{display:flex;gap:6px;padding:10px 12px 12px;align-items:flex-end}
.ai-input textarea{flex:1;resize:none;height:44px;max-height:120px;padding:11px 12px;border-radius:12px}
.ai-input .icon-btn{border:1px solid var(--line)}
.ai-input .rec{background:rgba(220,38,38,.12);color:var(--bad);border-color:var(--bad)}
.typing{display:flex;gap:4px;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.ai-page{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px}
.ai-page>.ai-chat{height:calc(100vh - 210px);min-height:520px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ai-page .chips-wrap .ai-chips{flex-wrap:wrap}
.cap{padding:10px 0;border-bottom:1px solid var(--line)}
.cap:last-child{border:none}
.cap b{display:block;margin-bottom:4px}
.cap a{display:block;font-size:12.5px;cursor:pointer;padding:2px 0;text-decoration:none}
.cap a:hover{text-decoration:underline}
/* ---------- manual ---------- */
.manual{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;align-items:start}
.toc{position:sticky;top:78px;max-height:calc(100vh - 100px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.toc input{width:100%;margin-bottom:8px}
.toc a{display:flex;gap:8px;padding:6px 10px;border-radius:8px;color:var(--ink2);text-decoration:none;font-size:13px;cursor:pointer}
.toc a:hover{background:var(--hover)}
.toc .n{color:var(--muted);width:18px;text-align:right;font-variant-numeric:tabular-nums}
.msec{overflow-wrap:anywhere;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 24px;margin-bottom:16px;scroll-margin-top:80px;line-height:1.65}
.msec h2{margin:0 0 4px;font-size:19px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.msec h2 .sp{flex:1}
.msec .lead{color:var(--muted);margin:0 0 12px}
.msec h4{margin:16px 0 6px;font-size:14px}
.msec ol,.msec ul{padding-left:22px;margin:6px 0}
.msec table{margin:8px 0}
.msec td,.msec th{white-space:normal}
.msec.flash{outline:2px solid var(--brand2)}
.tip{background:rgba(99,102,241,.07);border:1px solid rgba(99,102,241,.25);border-radius:10px;padding:9px 12px;margin:10px 0;font-size:13px}
/* ---------- responsive ---------- */
@media(max-width:1100px){.c2,.c11,.c3{grid-template-columns:1fr}.ai-page{grid-template-columns:1fr}}
@media(max-width:860px){
 #side{position:fixed;left:-260px;transition:left .2s;width:248px!important}
 body.side-open #side{left:0}
 body.side-open .side-backdrop{display:block;position:fixed;inset:0;background:rgba(2,6,23,.45);z-index:40}
 body.side-mini #nav .sec,body.side-mini #nav .lbl,body.side-mini .brand .bt,body.side-mini .side-foot{display:revert}
 body.side-mini #nav a{justify-content:flex-start;padding:9px 13px}
 main{padding:14px 16px 28px}.page-head{padding:16px 16px 0}.top{padding:0 10px;gap:4px}.foot{padding:12px 16px}
 .hide-m{display:none!important}
 .search{flex:1}.kbd{display:none}.search input{padding-right:10px}
 .manual{grid-template-columns:minmax(0,1fr)}.msec table{display:block;overflow-x:auto}.toc{position:static;max-height:none}
 .login{grid-template-columns:1fr}.login-art{display:none}.mobile-only{display:block}
 #ai-fab{right:14px;bottom:14px;padding:0 14px}
 #ai-fab span{display:none}
 .qa{grid-template-columns:1fr}
 .slip .two{grid-template-columns:1fr}.slip .two>div:first-child{border-right:none;border-bottom:1px solid var(--line)}
}
@media print{
 :root,[data-theme=dark]{--card:#fff;--soft:#f8fafc;--ink:#0f172a;--ink2:#334155;--muted:#64748b;--line:#d5dbe4;--hover:#f1f5f9}
 body *{visibility:hidden}
 #printArea,#printArea *{visibility:visible}
 #printArea{position:absolute;left:0;top:0;width:100%}
 .modal{background:none;padding:0}
}

const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');

/* SHA-256 (sync, works on http:// and file:// where crypto.subtle is unavailable) */
function sha256(str){const ascii=unescape(encodeURIComponent(str));
 const rr=(v,a)=>(v>>>a)|(v<<(32-a)),mp=Math.pow,maxWord=mp(2,32);let i,j,result='';const words=[],bitLen=ascii.length*8;
 let hash=[],k=[],pc=0;const comp={};
 for(let c=2;pc<64;c++){if(!comp[c]){for(i=0;i<313;i+=c)comp[i]=c;hash[pc]=(mp(c,.5)*maxWord)|0;k[pc++]=(mp(c,1/3)*maxWord)|0}}
 hash=hash.slice(0,8);let s=ascii+'\x80';while(s.length%64-56)s+='\x00';
 for(i=0;i<s.length;i++){j=s.charCodeAt(i);words[i>>2]|=j<<((3-i)%4)*8}
 words[words.length]=((bitLen/maxWord)|0);words[words.length]=bitLen;
 for(j=0;j<words.length;){const w=words.slice(j,j+=16),old=hash;hash=hash.slice(0,8);
  for(i=0;i<64;i++){const w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];
   const t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
   const t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
   hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0}
  for(i=0;i<8;i++)hash[i]=(hash[i]+old[i])|0}
 for(i=0;i<8;i++)for(j=3;j+1;j--){const b=(hash[i]>>(j*8))&255;result+=((b<16)?0:'')+b.toString(16)}
 return result}

/* ---------- core rules ---------- */
function holidayOn(d){return DB.holidays.find(h=>h.date===d)}
function leaveDays(from,to){let n=0;for(let d=from;d<=to;d=addDays(d,1))if(!DB.settings.weeklyOff.includes(dow(d))&&!holidayOn(d))n++;return n}
function leaveOn(empId,d){return DB.leaves.find(l=>l.empId===empId&&l.status==='Approved'&&d>=l.from&&d<=l.to)}
function shiftById(id){return DB.shifts.find(s=>s.id===id)}
function shiftFor(e,d){const r=DB.roster[e.id+'|'+d];if(r)return r;if(DB.settings.weeklyOff.includes(dow(d)))return'WO';
 if(e.shift==='ROT')return['A','B','C'][(weekIndex(d)+parseInt(e.id.slice(1)))%3];return e.shift}
function shiftStarted(sid){const sh=shiftById(sid);return sh&&toMin(sh.start)<=nowMin()}
function sumSal(s){return(s.basic||0)+(s.hra||0)+(s.conveyance||0)+(s.medical||0)+(s.special||0)}
const active=()=>DB.employees.filter(e=>e.status==='Active');
const empById=id=>DB.employees.find(e=>e.id===id);
const shiftLabel=e=>e.shift==='ROT'?'Rotational':e.shift;

function evalDay(e,date){
 const S=DB.settings,r={date,shift:shiftFor(e,date),in:'',out:'',worked:0,late:0,early:0,ot:0,status:'',code:'',src:''};
 const rec=(DB.att[date]||{})[e.id];if(rec){r.in=rec.in||'';r.out=rec.out||'';r.src=rec.src||''}
 if(date<e.doj){r.status='Not joined';r.code='NJ';return r}
 const lv=leaveOn(e.id,date);if(lv){r.code=lv.type==='LOP'?'LOP':'L';r.status=lv.type==='LOP'?'LOP leave':'On leave ('+lv.type+')';return r}
 const hol=holidayOn(date),sh=shiftById(r.shift);
 if(r.in&&r.out){const i=toMin(r.in);let o=toMin(r.out);if(o<i)o+=1440;r.worked=Math.max(0,o-i-(sh?sh.brk:0));
  if(sh&&!hol){const s=toMin(sh.start);let en=toMin(sh.end);if(en<=s)en+=1440;
   r.late=Math.max(0,i-s);if(r.late<=S.graceMins)r.late=0;
   r.early=Math.max(0,en-o);if(r.early<=S.graceMins)r.early=0;
   const otm=o-en;r.ot=otm>=S.otMinMins?Math.floor(otm/30)*0.5:0;}}
 else if(r.in&&sh&&!hol){const i=toMin(r.in),s=toMin(sh.start);r.late=Math.max(0,i-s);if(r.late<=S.graceMins)r.late=0}
 if(hol||r.shift==='WO'){
  if(r.in&&r.out){r.ot=Math.floor(r.worked/30)*0.5;r.late=r.early=0;r.code=hol?'HW':'WW';r.status=(hol?'Holiday':'Weekly off')+' – worked'}
  else{r.code=hol?'H':'WO';r.status=hol?'Holiday: '+hol.name:'Weekly off'}return r}
 if(!r.in){if(date>TODAY){r.status='Upcoming';r.code=''}else if(date===TODAY){r.status=shiftStarted(r.shift)?'Yet to punch':'Shift not started';r.code='-'}else{r.status='Absent';r.code='A'}return r}
 if(!r.out){if(date===TODAY){r.status='Checked in';r.code='P'}else{r.status='Missed punch';r.code='MP'}return r}
 let len=toMin(sh.end)-toMin(sh.start);if(len<=0)len+=1440;len-=sh.brk;
 if(r.worked<len*0.6){r.status='Half day';r.code='HD';return r}
 r.code='P';r.status='Present'+(r.late?' · Late':'')+(r.early?' · Early out':'');return r}

function badge(r){const m={P:r.late||r.early?'b-warn':'b-ok',A:'b-bad',L:'b-info',LOP:'b-bad',HD:'b-warn',MP:'b-warn',WO:'b-mute',H:'b-mute',WW:'b-pur',HW:'b-pur',NJ:'b-mute','-':'b-mute','':'b-mute'};return`<span class="badge ${m[r.code]||'b-mute'}">${esc(r.status)}</span>`}
function ptSlab(g){const sl=DB.settings.ptSlabs.slice().sort((a,b)=>a.upto-b.upto);for(let i=0;i<sl.length;i++)if(g<=sl[i].upto)return{...sl[i],prev:i?sl[i-1].upto:0};return{upto:Infinity,amt:0,prev:0}}
function ptFor(g){return+ptSlab(g).amt}
function annualTax(taxable){ // New regime slabs (FY 2025-26 onward) incl. 87A rebate up to ₹12L and 4% cess — demo estimate
 if(taxable<=1200000)return 0;const sl=[[400000,0],[800000,.05],[1200000,.10],[1600000,.15],[2000000,.20],[2400000,.25],[Infinity,.30]];
 let t=0,prev=0;for(const[lim,rate]of sl){if(taxable>prev)t+=(Math.min(taxable,lim)-prev)*rate;prev=lim}return Math.round(t*1.04)}

function computePayroll(ym){
 const S=DB.settings,D=daysInMonth(ym),dates=monthDates(ym);
 return DB.employees.filter(e=>e.status==='Active'&&e.doj<=dates[D-1]).map(e=>{
  const c={present:0,absent:0,half:0,leave:0,lopLeave:0,wo:0,hol:0,late:0,nj:0,mp:0,ot:0};let lop=0;
  for(const d of dates){if(d>TODAY)continue;const r=evalDay(e,d);
   switch(r.code){case'A':c.absent++;lop++;break;case'HD':c.half++;lop+=.5;break;case'LOP':c.lopLeave++;lop++;break;case'L':c.leave++;break;case'WO':case'WW':c.wo++;break;case'H':case'HW':c.hol++;break;case'NJ':c.nj++;lop++;break;case'MP':c.mp++;c.present++;break;case'P':c.present++;break}
   c.ot+=r.ot;if(r.late)c.late++}
  const paid=D-lop,f=paid/D,s=e.salary,fixed=sumSal(s);
  const earn={basic:Math.round(s.basic*f),hra:Math.round(s.hra*f),conveyance:Math.round(s.conveyance*f),medical:Math.round(s.medical*f),special:Math.round(s.special*f)};
  const otPay=e.otEligible?Math.round(c.ot*(fixed/D/8)*S.otMultiplier):0;
  const gross=earn.basic+earn.hra+earn.conveyance+earn.medical+earn.special+otPay;
  const pfWage=e.pf?Math.min(earn.basic,S.pfWageCap):0,pfEE=Math.round(pfWage*S.pfRate/100),epsER=Math.round(pfWage*S.epsRate/100),epfER=Math.round(pfWage*S.pfRate/100)-epsER;
  const esiOn=e.esi&&fixed<=S.esiLimit,esiEE=esiOn?Math.ceil(gross*S.esiEmpRate/100):0,esiER=esiOn?Math.ceil(gross*S.esiErRate/100):0;
  const pt=e.pt?ptFor(gross):0,annualGross=fixed*12,taxable=Math.max(0,annualGross-S.stdDeduction),annTax=e.tds?annualTax(taxable):0,tds=Math.round(annTax/12);
  const other=+e.loan||0,ded=pfEE+esiEE+pt+tds+other;
  return{empId:e.id,code:e.code,name:e.name,dept:e.dept,designation:e.designation,doj:e.doj,pan:e.pan,uan:e.uan,esiNo:e.esiNo,bank:e.bank,acct:e.acct,ifsc:e.ifsc,
   days:D,paidDays:paid,lop,...c,ot:c.ot,fixed,earn,otPay,gross,pfWage,pfEE,epsER,epfER,esiEE,esiER,pt,annualGross,taxable,annTax,tds,other,ded,net:gross-ded}})}

/* ---------- analytics helpers (used by dashboard + AI) ---------- */
function monthStats(e,ym){const c={present:0,half:0,absent:0,leave:0,lop:0,wo:0,hol:0,late:0,lateMin:0,early:0,mp:0,ot:0,worked:0,wdays:0};
 for(const d of monthDates(ym)){if(d>TODAY)break;const r=evalDay(e,d);
  switch(r.code){case'P':c.present++;break;case'MP':c.present++;c.mp++;break;case'HD':c.half++;break;case'A':c.absent++;break;case'L':c.leave++;break;case'LOP':c.lop++;break;case'WO':case'WW':c.wo++;break;case'H':case'HW':c.hol++;break}
  if(r.worked){c.worked+=r.worked;c.wdays++}if(r.late){c.late++;c.lateMin+=r.late}if(r.early)c.early++;c.ot+=r.ot}return c}
function missedPunches(days){const out=[];for(let i=1;i<=days;i++){const d=addDays(TODAY,-i);for(const e of active()){const r=evalDay(e,d);if(r.code==='MP')out.push({e,d,r})}}return out}
function absentStreaks(){const out=[];for(const e of active()){let n=0;for(let i=1;i<=10;i++){const r=evalDay(e,addDays(TODAY,-i));if(['WO','H'].includes(r.code))continue;if(r.code==='A')n++;else break}if(n>=2)out.push({e,n})}return out}
function missingIds(){return active().map(e=>{const m=[];if(e.pf&&!e.uan)m.push('UAN');if(e.esi&&sumSal(e.salary)<=DB.settings.esiLimit&&!e.esiNo)m.push('ESI no.');if(!e.pan)m.push('PAN');if(!e.acct||!e.ifsc)m.push('Bank');return{e,m}}).filter(x=>x.m.length)}
function latestRun(){return Object.keys(DB.payroll).sort().pop()||null}
function leaveUsed(empId,type){const Y=TODAY.slice(0,4);return DB.leaves.filter(l=>l.empId===empId&&l.type===type&&l.status==='Approved'&&l.from.startsWith(Y)).reduce((a,l)=>a+l.days,0)}

 const tabs=`<div class="tabs"><a class="${state.attTab==='daily'?'on':''}" onclick="state.attTab='daily';render()">Daily attendance</a><a class="${state.attTab==='monthly'?'on':''}" onclick="state.attTab='monthly';render()">Monthly register</a><a class="${state.attTab==='summary'?'on':''}" onclick="state.attTab='summary';render()">Late / early / OT summary</a></div>`;

  ${rows.map(({e,r})=>{const sh=shiftById(r.shift);return`<tr><td><b>${esc(e.name)}</b><div class="muted small">${e.code}</div></td><td>${esc(e.dept)}</td><td>${sh?`<span class="badge" style="background:${sh.color}22;color:${sh.color}">${sh.id} ${sh.start}-${sh.end}</span>`:r.shift}</td><td>${r.in||'—'}</td><td>${r.out||'—'}</td><td class="n">${hrs(r.worked)}</td><td class="n">${r.late||''}</td><td class="n">${r.early||''}</td><td class="n">${r.ot||''}</td><td>${badge(r)}</td><td class="small muted">${esc(r.src)}</td><td style="white-space:nowrap"><button class="btn sm" onclick="editPunch('${e.id}','${state.attDate}')">Edit</button> ${aiq(`Explain attendance of ${e.code} on ${state.attDate}`,'','Explain this status')}</td></tr>`}).join('')}</table></div>`}
 if(state.attTab==='monthly'){const ds=monthDates(state.attMonth);
  return tabs+`<div class="toolbar"><input type="month" value="${state.attMonth}" onchange="state.attMonth=this.value;render()">${deptSel(state.dept,true)}<span class="sp"></span><span class="small muted">P Present · A Absent · L Leave · HD Half day · MP Missed punch · WO Weekly off · H Holiday · WW/HW worked on off-day</span></div>
  <div class="tbl-wrap"><table class="reg"><tr><th>Employee</th>${ds.map(d=>`<th>${+d.slice(8)}<div class="muted" style="font-weight:400">${'SMTWTFS'[dow(d)]}</div></th>`).join('')}<th>P</th><th>A</th><th>L</th><th>OT</th></tr>
  ${emps.map(e=>{let P=0,A=0,Lv=0,OT=0;const cells=ds.map(d=>{const r=evalDay(e,d);if(r.code==='P'||r.code==='MP')P++;if(r.code==='HD')P+=.5;if(r.code==='A')A++;if(r.code==='L'||r.code==='LOP')Lv++;OT+=r.ot;return`<td class="cell-${r.code}" title="${esc(r.status)}${r.in?' '+r.in+'-'+(r.out||'?'):''}" style="cursor:pointer" onclick="editPunch('${e.id}','${d}')">${r.code==='-'||r.code==='NJ'?'':r.code}</td>`}).join('');return`<tr><td>${esc(e.name)}</td>${cells}<td><b>${P}</b></td><td>${A}</td><td>${Lv}</td><td>${OT}</td></tr>`}).join('')}</table></div>`}
 const ds=monthDates(state.attMonth).filter(d=>d<=TODAY);
 return tabs+`<div class="toolbar"><input type="month" value="${state.attMonth}" onchange="state.attMonth=this.value;render()">${deptSel(state.dept,true)}<span class="sp"></span>${aiq('Who has the most overtime this month?','OT ranking')}</div>
 <div class="tbl-wrap"><table><tr><th>Employee</th><th>Shift</th><th class="n">Late count</th><th class="n">Late mins</th><th class="n">Early-out count</th><th class="n">Early mins</th><th class="n">Missed punches</th><th class="n">OT hours</th><th class="n">Avg hrs/day</th></tr>
 ${emps.map(e=>{const rs=ds.map(d=>evalDay(e,d)),w=rs.filter(r=>r.worked);return`<tr><td>${esc(e.name)}</td><td>${shiftLabel(e)}</td><td class="n">${rs.filter(r=>r.late).length}</td><td class="n">${rs.reduce((a,r)=>a+r.late,0)}</td><td class="n">${rs.filter(r=>r.early).length}</td><td class="n">${rs.reduce((a,r)=>a+r.early,0)}</td><td class="n">${rs.filter(r=>r.code==='MP').length}</td><td class="n">${rs.reduce((a,r)=>a+r.ot,0)}</td><td class="n">${w.length?(w.reduce((a,r)=>a+r.worked,0)/w.length/60).toFixed(1):''}</td></tr>`}).join('')}</table></div>`}
function editPunch(empId,date){if(!can('attendance'))return;const e=empById(empId),rec=(DB.att[date]||{})[empId]||{},r=evalDay(e,date);
 openModal(`<h2>Attendance correction<span class="sp"></span><button class="btn sm" onclick="closeModal()">✕</button></h2>
 <p><b>${esc(e.name)}</b> · ${fmtDate(date)} · Shift ${r.shift} · ${badge(r)}</p>
 <div class="form"><label>In time<input type="time" id="p_in" value="${rec.in||''}"></label><label>Out time<input type="time" id="p_out" value="${rec.out||''}"></label>
 <label>Shift for this day (roster)<select id="p_sh"><option value="">Default</option>${DB.shifts.map(s=>`<option value="${s.id}" ${DB.roster[empId+'|'+date]===s.id?'selected':''}>${s.id} – ${esc(s.name)}</option>`).join('')}<option value="WO" ${DB.roster[empId+'|'+date]==='WO'?'selected':''}>Weekly off</option></select></label>
 <label class="full">Reason for correction<input id="p_note" value="${esc(rec.note||'')}" placeholder="e.g. Forgot to punch out, approved by supervisor"></label></div>
 <div class="actions"><button class="btn danger" onclick="savePunch('${empId}','${date}',true)">Clear punches</button><span style="flex:1"></span><button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="savePunch('${empId}','${date}')">Save</button></div>`)}
function savePunch(empId,date,clear){DB.att[date]=DB.att[date]||{};const e=empById(empId);
 if(clear){delete DB.att[date][empId];log('Punches cleared',`${e.name} · ${fmtDate(date)}`)}
 else{const i=$('#p_in').value,o=$('#p_out').value;if(i||o)DB.att[date][empId]={in:i,out:o,src:'Manual',note:$('#p_note').value};else delete DB.att[date][empId];
  const sh=$('#p_sh').value,k=empId+'|'+date;if(sh)DB.roster[k]=sh;else delete DB.roster[k];log('Attendance corrected',`${e.name} · ${fmtDate(date)} · ${i||'—'} to ${o||'—'}`)}
 save();closeModal();render();toast('Attendance updated')}

function pgDevices(){const sample=JSON.stringify({deviceId:'D2',serial:'CKJ4223460123',punches:[{empCode:'VT1003',time:TODAY+'T05:52:10',type:'IN',verify:'FP'},{empCode:'VT1003',time:TODAY+'T14:08:44',type:'OUT',verify:'FP'}]},null,2);
 return`<div class="toolbar"><span class="sp"></span>${aiq('How do I connect a real biometric device?','Integration help')}<button class="btn" onclick="importPunches()">${I('upload')} Import punch log (CSV/JSON)</button><button class="btn" onclick="deviceForm()">+ Add device</button><button class="btn pri" onclick="syncAll()">${I('refresh')} Sync all devices</button></div>
 <div class="grid kpis">${DB.devices.map(d=>`<div class="card dev"><div style="display:flex;align-items:center;gap:8px"><span class="dot" style="background:${d.status==='Online'?'#16a34a':'#dc2626'}"></span><span class="nm">${esc(d.name)}</span><span style="flex:1"></span><span class="badge ${d.status==='Online'?'b-ok':'b-bad'}">${d.status}</span></div>
  <div class="kv"><span>Device</span><span>${esc(d.make)} ${esc(d.model)}</span><span>IP : Port</span><span>${esc(d.ip)}:${d.port}</span><span>Location</span><span>${esc(d.location)}</span><span>Enrolled users</span><span>${DB.employees.filter(e=>e.deviceId===d.id).length}</span><span>Last sync</span><span>${d.lastSync?fmtDT(d.lastSync):'never'}</span></div>
  <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap"><button class="btn sm pri" onclick="syncDevice('${d.id}')">${I('refresh')} Sync now</button><button class="btn sm" onclick="deviceForm('${d.id}')">Edit</button><button class="btn sm" onclick="toggleDev('${d.id}')">${d.status==='Online'?'Mark offline':'Mark online'}</button></div></div>`).join('')}</div>
 <div class="grid c11" style="margin-top:16px">
  <div class="card"><h3>Recent raw punches</h3>${DB.punchLog.length?`<div class="tbl-wrap" style="max-height:340px"><table><tr><th>Date</th><th>Time</th><th>Employee</th><th>Type</th><th>Device</th></tr>${DB.punchLog.slice(0,40).map(p=>`<tr><td>${fmtDate(p.date)}</td><td>${p.time}</td><td>${esc(empById(p.empId)?.name||p.empId)}</td><td>${p.type}</td><td>${esc(p.device)}</td></tr>`).join('')}</table></div>`:'<p class="muted">No punches yet.</p>'}</div>
  <div class="card"><h3>How the real integration works</h3>
   <p class="small">In production, a small connector service (Windows service / cron) reads punches from each device — via the vendor SDK (ZKTeco / eSSL use port 4370), ADMS / iClock push, or the vendor's attendance database — and posts them to the payroll API. In this demo, <b>Sync</b> simulates that and <b>Import</b> accepts a CSV export from the device software.</p>
   <p class="small muted">Example payload <code>POST /api/punches</code>:</p><pre class="code">${esc(sample)}</pre>
   <p class="small muted">CSV import format: <code>EmpCode,Date,Time</code> e.g. <code>VT1003,${TODAY},05:52</code>. First punch of the day = IN, last = OUT.</p></div></div>`}
function syncDevice(id,quiet){const d=DB.devices.find(x=>x.id===id);if(d.status!=='Online'){if(!quiet)toast(d.name+' is offline — cannot sync');return 0}
 const nm=nowMin();let n=0;DB.att[TODAY]=DB.att[TODAY]||{};
 for(const e of active().filter(e=>e.deviceId===id)){const sid=shiftFor(e,TODAY),sh=shiftById(sid);if(!sh||holidayOn(TODAY)||leaveOn(e.id,TODAY))continue;
  const s=toMin(sh.start),en=toMin(sh.end),rec=DB.att[TODAY][e.id];
  if(!rec&&nm>=s-15){const t=fromMin(Math.min(nm,s-Math.floor(Math.random()*15)+(Math.random()<.15?20:0)));DB.att[TODAY][e.id]={in:t,out:'',src:id};DB.punchLog.unshift({empId:e.id,date:TODAY,time:t,device:id,type:'IN'});n++}
  else if(rec&&rec.in&&!rec.out&&en>s&&nm>=en){const t=fromMin(en+Math.floor(Math.random()*20));rec.out=t;DB.punchLog.unshift({empId:e.id,date:TODAY,time:t,device:id,type:'OUT'});n++}}
 d.lastSync=new Date().toISOString();DB.punchLog=DB.punchLog.slice(0,300);if(!quiet){log('Device synced',`${d.name}: ${n} punch(es)`);save();render();toast(`${d.name}: ${n} new punch(es) fetched`)}return n}
function syncAll(quiet){let n=0;DB.devices.forEach(d=>n+=syncDevice(d.id,true));const off=DB.devices.filter(d=>d.status!=='Online').length;log('Devices synced',`${n} new punch(es)${off?`, ${off} offline skipped`:''}`);save();render();if(!quiet)toast(`Sync complete — ${n} new punch(es).${off?' Offline devices skipped.':''}`);return{n,off}}
function toggleDev(id){const d=DB.devices.find(x=>x.id===id);d.status=d.status==='Online'?'Offline':'Online';log('Device status',`${d.name} marked ${d.status}`);save();render()}
function deviceForm(id){const d=id?DB.devices.find(x=>x.id===id):{id:'',name:'',make:'ZKTeco',model:'',ip:'192.168.1.',port:4370,location:'',status:'Online'};
 const f=(k,l)=>`<label>${l}<input id="d_${k}" value="${esc(d[k])}"></label>`;
 openModal(`<h2>${id?'Edit':'Add'} biometric device<span class="sp"></span><button class="btn sm" onclick="closeModal()">✕</button></h2><div class="form">${f('name','Name')}${f('make','Make')}${f('model','Model')}${f('ip','IP address')}${f('port','Port')}${f('location','Location')}</div>
 <div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="saveDevice('${d.id}')">Save</button></div>`)}
function saveDevice(id){const v=k=>$('#d_'+k).value.trim(),o={name:v('name'),make:v('make'),model:v('model'),ip:v('ip'),port:+v('port')||4370,location:v('location')};
 if(id)Object.assign(DB.devices.find(x=>x.id===id),o);else DB.devices.push({id:'D'+(DB.devices.length+1),status:'Online',lastSync:'',...o});log(id?'Device updated':'Device added',o.name);save();closeModal();render()}
function importPunches(){openModal(`<h2>Import punch log<span class="sp"></span><button class="btn sm" onclick="closeModal()">✕</button></h2>
 <p class="small muted">Paste a CSV (<code>EmpCode,Date,Time</code>) or JSON array (<code>[{"empCode":"VT1001","date":"${TODAY}","time":"09:28"}]</code>), or choose a file exported from the device software.</p>
 <input type="file" accept=".csv,.txt,.json" onchange="const r=new FileReader();r.onload=()=>document.getElementById('pl').value=r.result;r.readAsText(this.files[0])"><br><br>
 <textarea id="pl" rows="9" style="width:100%" placeholder="VT1001,${TODAY},09:28&#10;VT1001,${TODAY},18:41"></textarea>
 <div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="doImportPunches()">Import</button></div>`)}
function doImportPunches(){const txt=$('#pl').value.trim();if(!txt)return;let list=[];
 try{if(txt[0]==='['||txt[0]==='{'){const j=JSON.parse(txt);const arr=Array.isArray(j)?j:j.punches;list=arr.map(p=>{let date=p.date,time=p.time;if(time&&time.includes('T')){date=time.slice(0,10);time=time.slice(11,16)}return{code:p.empCode||p.code,date,time}})}
  else list=txt.split(/\r?\n/).map(l=>l.split(/[,;\t]/).map(s=>s.trim())).filter(a=>a.length>=3&&/^\d{4}-\d{2}-\d{2}$/.test(a[1])).map(a=>({code:a[0],date:a[1],time:a[2].slice(0,5)}))}catch(e){return alert('Could not parse input')}
 const g={};let skipped=0;list.forEach(p=>{const e=DB.employees.find(x=>x.code===p.code);if(!e||!/^\d{1,2}:\d{2}$/.test(p.time||'')){skipped++;return}const k=e.id+'|'+p.date;(g[k]=g[k]||[]).push(p.time.padStart(5,'0'))});
 let n=0;Object.entries(g).forEach(([k,ts])=>{const[id,date]=k.split('|');ts.sort();DB.att[date]=DB.att[date]||{};DB.att[date][id]={in:ts[0],out:ts.length>1?ts[ts.length-1]:'',src:'Import'};ts.forEach((t,i)=>DB.punchLog.unshift({empId:id,date,time:t,device:'Import',type:i===0?'IN':'OUT'}));n++});
 log('Punch log imported',`${n} record(s)${skipped?`, ${skipped} skipped`:''}`);save();closeModal();render();toast(`Imported ${n} attendance record(s)${skipped?`, ${skipped} line(s) skipped`:''}`)}

function saveLeave(fromESS){const p=fromESS?'el_':'l_',v=k=>document.getElementById(p+k).value,emp=fromESS?state.essEmp:v('emp');
 const from=v('from'),to=v('to');if(!from||!to||to<from)return alert('Check dates');const days=leaveDays(from,to);if(!days)return alert('Selected range has no working days');
 const t=DB.leaveTypes.find(x=>x.code===v('type'));if(t.paid&&leaveUsed(emp,t.code)+days>t.quota&&!confirm('This exceeds the '+t.code+' balance. Submit anyway?'))return;

  <div class="tbl-wrap" style="margin-top:16px"><table><tr><th>Employee</th><th class="n">Paid days</th><th class="n">LOP</th><th class="n">OT h</th><th class="n">Basic</th><th class="n">HRA</th><th class="n">Other allow.</th><th class="n">OT pay</th><th class="n">Gross</th><th class="n">PF</th><th class="n">ESI</th><th class="n">PT</th><th class="n">TDS</th><th class="n">Loan</th><th class="n">Net pay</th><th></th></tr>

  <tfoot><tr><td>Total</td><td></td><td class="n">${T('lop')}</td><td class="n">${T('ot')}</td><td class="n">${num(T(r=>r.earn.basic))}</td><td class="n">${num(T(r=>r.earn.hra))}</td><td class="n">${num(T(r=>r.earn.conveyance+r.earn.medical+r.earn.special))}</td><td class="n">${num(T('otPay'))}</td><td class="n">${num(T('gross'))}</td><td class="n">${num(T('pfEE'))}</td><td class="n">${num(T('esiEE'))}</td><td class="n">${num(T('pt'))}</td><td class="n">${num(T('tds'))}</td><td class="n">${num(T('other'))}</td><td class="n">${num(T('net'))}</td><td></td></tr></tfoot></table></div>`}

 ${partial?'<div class="note warnbox">This is the current month. Days after today are treated as paid (projection). Run final payroll after month end.</div>':''}

function runPayroll(ym){ym=ym||state.payMonth;if(DB.payroll[ym]?.status==='Locked')return;DB.payroll[ym]={status:'Draft',processedOn:new Date().toISOString(),rows:computePayroll(ym)};log('Payroll processed',`${monthName(ym)} — ${DB.payroll[ym].rows.length} employees`);save();render();toast('Payroll processed for '+monthName(ym))}
function lockRun(l,ym){ym=ym||state.payMonth;const r=DB.payroll[ym];if(!r)return;if(!l&&VIA==='UI'&&!confirm('Unlock payroll for editing?'))return;r.status=l?'Locked':'Draft';log(l?'Payroll locked':'Payroll unlocked',monthName(ym));save();render()}

 <div class="two"><div><table><tr><th>Earnings</th><th class="n">Amount</th></tr>${Array.from({length:rows},(_,i)=>`<tr><td>${E[i]?E[i][0]:'&nbsp;'}</td><td class="n">${E[i]?num(E[i][1]):''}</td></tr>`).join('')}<tfoot><tr><td>Gross earnings</td><td class="n">${num(r.gross)}</td></tr></tfoot></table></div>

function reportData(type,ym){const run=DB.payroll[ym],R=run?run.rows:null,S=DB.settings;
 if(type==='attendance'){const ds=monthDates(ym).filter(d=>d<=TODAY);return{head:['Code','Name','Dept','Present','Half day','Absent','Leave','LOP leave','Weekly off','Holidays','Late','OT hrs'],rows:active().map(e=>{const rs=ds.map(d=>evalDay(e,d)),c=k=>rs.filter(r=>k.includes(r.code)).length;return[e.code,e.name,e.dept,c(['P','MP']),c(['HD']),c(['A']),c(['L']),c(['LOP']),c(['WO','WW']),c(['H','HW']),rs.filter(r=>r.late).length,rs.reduce((a,r)=>a+r.ot,0)]}),sum:[3,4,5,6,7,8,9,10,11]}}
 if(!R)return null;
 const M={register:{head:['Code','Name','Dept','Paid days','Gross','PF','ESI','PT','TDS','Loan','Deductions','Net pay'],rows:R.map(r=>[r.code,r.name,r.dept,r.paidDays,r.gross,r.pfEE,r.esiEE,r.pt,r.tds,r.other,r.ded,r.net]),sum:[4,5,6,7,8,9,10,11]},
  pf:{head:['UAN','Member name','Gross wages','EPF wages','EPS wages','EDLI wages','EPF contri (EE 12%)','EPS contri (ER 8.33%)','EPF-EPS diff (ER 3.67%)','NCP days','Refund of advances'],rows:R.filter(r=>r.pfWage).map(r=>[r.uan,r.name,r.gross,r.pfWage,r.pfWage,r.pfWage,r.pfEE,r.epsER,r.epfER,r.lop,0]),sum:[2,3,4,5,6,7,8,9]},
  esi:{head:['IP number','IP name','No. of days paid','Total monthly wages','EE contribution (0.75%)','ER contribution (3.25%)','Total'],rows:R.filter(r=>r.esiEE).map(r=>[r.esiNo,r.name,r.paidDays,r.gross,r.esiEE,r.esiER,r.esiEE+r.esiER]),sum:[3,4,5,6]},
  pt:{head:['Code','Name','Gross wages','Professional tax'],rows:R.filter(r=>r.pt).map(r=>[r.code,r.name,r.gross,r.pt]),sum:[2,3]},
  tds:{head:['Code','Name','PAN','Projected annual gross','Std. deduction','Taxable income','Annual tax (incl. cess)','TDS this month'],rows:R.map(r=>[r.code,r.name,r.pan,r.annualGross,Math.min(S.stdDeduction,r.annualGross),r.taxable,r.annTax,r.tds]),sum:[3,4,5,6,7]},
  bank:{head:['Code','Beneficiary name','Bank','Account number','IFSC','Amount'],rows:R.map(r=>[r.code,r.name,r.bank,r.acct,r.ifsc,r.net]),sum:[5]}};return M[type]}

function saveUser(id){const v=k=>$('#u_'+k)?.value.trim();const o={name:v('name'),role:v('role'),empId:v('emp'),active:$('#u_active').checked};
 if(!o.name)return alert('Name is required');if(o.role==='employee'&&!o.empId)return alert('Link an employee for the Employee role');
 if(id){const u=DB.users.find(x=>x.id===id);if(u.role==='admin'&&o.role!=='admin'&&DB.users.filter(x=>x.role==='admin'&&x.active).length<2)return alert('At least one active administrator is required');if(u.id===SESSION.user.id)o.active=true;Object.assign(u,o);log('User updated',`${u.username} · ${ROLES[u.role].label}`)}
 else{const un=v('username').toLowerCase();if(!/^[a-z0-9._-]{3,30}$/.test(un))return alert('Username: 3–30 letters, digits, dot, dash or underscore');if(DB.users.some(x=>x.username===un))return alert('Username already exists');const pw=$('#u_pw').value;if(pw.length<6)return alert('Password must be at least 6 characters');
  const u=mkUser(un,o.name,o.role,o.empId,pw);u.active=o.active;DB.users.push(u);log('User created',`${un} · ${ROLES[o.role].label}`)}
 save();closeModal();render();toast('User saved')}
function resetPwForm(id){const u=DB.users.find(x=>x.id===id);openModal(`<h2>Reset password — ${esc(u.username)}<span class="sp"></span><button class="btn sm" onclick="closeModal()">✕</button></h2>

function toggleUser(id){const u=DB.users.find(x=>x.id===id);if(u.role==='admin'&&u.active&&DB.users.filter(x=>x.role==='admin'&&x.active).length<2)return alert('At least one active administrator is required');u.active=!u.active;log(u.active?'User enabled':'User disabled',u.username);save();render()}
function deleteUser(id){const u=DB.users.find(x=>x.id===id);if(u.role==='admin'&&DB.users.filter(x=>x.role==='admin'&&x.active).length<2&&u.active)return alert('At least one active administrator is required');if(!confirm(`Delete user ${u.username}?`))return;DB.users=DB.users.filter(x=>x.id!==id);log('User deleted',u.username);save();render()}

const MON_RE='jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|june?|july?|aug(?:ust)?|sep(?:t(?:ember)?)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?';
const monIdx=s=>['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'].indexOf(s.slice(0,3));
const WD=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
const normQ=q=>String(q||'').toLowerCase().replace(/[’‘`]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g,' ').replace(/[?!.]+$/,'').trim();

/* ---------- entity parsers ---------- */
function P_dates(t){const out=[];let s=t;const Y=+TODAY.slice(0,4);
 const valid=(y,m,d)=>(m<1||m>12||d<1||d>daysInMonth(y+'-'+pad(m)))?null:`${y}-${pad(m)}-${pad(d)}`;
 const take=(re,fn)=>{s=s.replace(re,(...a)=>{const idx=a[a.length-2];const d=fn(a);if(d)out.push({i:idx,d});return' '.repeat(a[0].length)})};
 take(/\bday after tomorrow\b/g,()=>addDays(TODAY,2));take(/\btomorrow\b/g,()=>addDays(TODAY,1));take(/\byesterday\b/g,()=>addDays(TODAY,-1));take(/\btoday\b/g,()=>TODAY);
 take(/\b(20\d\d)-(\d{1,2})-(\d{1,2})\b/g,a=>valid(+a[1],+a[2],+a[3]));
 take(/\b(\d{1,2})[\/.-](\d{1,2})[\/.-](20\d\d|\d\d)\b/g,a=>valid(a[3].length===2?2000+(+a[3]):+a[3],+a[2],+a[1]));
 take(new RegExp(`\\b(\\d{1,2})(?:st|nd|rd|th)?\\s*(?:of\\s+)?(${MON_RE})\\b(?:,?\\s*(20\\d\\d))?`,'g'),a=>valid(a[3]?+a[3]:Y,monIdx(a[2])+1,+a[1]));
 take(new RegExp(`\\b(${MON_RE})\\s+(\\d{1,2})(?:st|nd|rd|th)?\\b(?:,?\\s*(20\\d\\d))?`,'g'),a=>valid(a[3]?+a[3]:Y,monIdx(a[1])+1,+a[2]));
 take(/\b(?:(last|next|this|coming|on)\s+)?(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/g,a=>{const w=WD.indexOf(a[2]),cur=dow(TODAY);let d=(w-cur+7)%7;if(a[1]==='last')d=d===0?-7:d-7;else if(a[1]==='next'&&d===0)d=7;return addDays(TODAY,d)});
 return out.sort((a,b)=>a.i-b.i).map(x=>x.d)}
function P_month(t){if(/\b(this|current) month\b/.test(t))return TODAY.slice(0,7);if(/\b(last|previous|prev) month\b/.test(t))return prevMonth(TODAY.slice(0,7));
 let m=t.match(/\b(20\d\d)-(0[1-9]|1[0-2])\b(?!-\d)/);if(m)return m[1]+'-'+m[2];
 const re=new RegExp(`\\b(${MON_RE})\\b(?:\\s*'?,?\\s*(20\\d\\d))?`,'g');let x;
 while((x=re.exec(t))){if(x[1]==='may'&&!x[2]&&!/\b(in|for|of|during)\s+may\b/.test(t))continue;const mi=monIdx(x[1]);let y=x[2]?+x[2]:+TODAY.slice(0,4);if(!x[2]&&mi+1>+TODAY.slice(5,7))y--;return y+'-'+pad(mi+1)}
 return null}
function P_times(t){const out=[];const s=t.replace(/\b\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4}\b|\b20\d\d-\d{1,2}-\d{1,2}\b/g,' ');
 const re=/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b|\b(\d{1,2})[:.](\d{2})\b/g;let m;
 while((m=re.exec(s))){let h,mi;if(m[3]){h=+m[1];mi=+(m[2]||0);if(m[3]==='pm'&&h<12)h+=12;if(m[3]==='am'&&h===12)h=0}else{h=+m[4];mi=+m[5]}if(h<24&&mi<60)out.push(pad(h)+':'+pad(mi))}return out}
function P_emps(t){const res=[];for(const e of DB.employees){let sc=0;if(new RegExp('\\b'+e.code.toLowerCase()+'\\b').test(t))sc=100;const nm=e.name.toLowerCase();if(t.includes(nm))sc=Math.max(sc,90);
  nm.split(/\s+/).forEach((p,i)=>{if(p.length>=3&&new RegExp('\\b'+escRe(p)+"(?:'s|s)?\\b").test(t))sc=Math.max(sc,i===0?60:40)});if(sc)res.push({e,sc})}
 res.sort((a,b)=>b.sc-a.sc);if(!res.length)return[];const top=res[0].sc;return res.filter(r=>r.sc===top).map(r=>r.e)}
function P_dept(t){if(/\b(hr|human resources?)\b/.test(t))return'HR & Admin';for(const d of DB.departments){const w=d.toLowerCase().split(/[\s&]+/)[0];if(new RegExp('\\b'+escRe(w)).test(t))return d}if(/\b(qc|qa)\b/.test(t))return'Quality';return null}
function P_ltype(t){if(/\b(cl|casual)\b/.test(t))return'CL';if(/\b(sl|sick|medical)\b/.test(t))return'SL';if(/\b(el|earned|privilege|pl|annual)\b/.test(t))return'EL';if(/\b(lop|loss of pay|unpaid|without pay)\b/.test(t))return'LOP';return null}
function P_shift(t){for(const re of[/\bshift\s*[-:]?\s*([a-z]{1,3})\b/g,/\b([a-z]{1,3})\s*shift\b/g,/\b(?:to|into|as|on)\s+([abc])\b/g])for(const m of t.matchAll(re)){const c=m[1].toUpperCase();if(shiftById(c))return c}
 if(/\bnight\b|third shift/.test(t))return'C';if(/\bevening\b|second shift|afternoon shift/.test(t))return'B';if(/\bmorning\b|first shift/.test(t))return'A';if(/\bgeneral\b|\bgen\b|day shift/.test(t))return'GEN';if(/\b(weekly off|week off|day off|wo)\b/.test(t))return'WO';return null}
function P_pct(t){const m=t.match(/(\d+(?:\.\d+)?)\s*(?:%|percent|per cent)/);return m?+m[1]:null}
function P_amount(t){if(P_pct(t))return null;let m=t.match(/(\d+(?:\.\d+)?)\s*(k|thousand|l|lakh|lakhs|lac)\b/);if(m)return Math.round(+m[1]*(/^(k|th)/.test(m[2])?1000:100000));
 m=t.match(/(?:₹|\brs\.?|\binr)\s*([\d,]+)/);if(m)return+m[1].replace(/,/g,'');
 const all=[...t.matchAll(/\b(\d{1,3}(?:,\d{2,3})+|\d{4,7})\b/g)].map(x=>+x[1].replace(/,/g,'')).filter(n=>!(n>=1990&&n<=2099));return all[0]||null}
const titleCase=s=>s.replace(/\s+/g,' ').trim().replace(/\b\w/g,c=>c.toUpperCase());

function resolveEmp(t,c){const me=SESSION.user,self=me.empId?empById(me.empId):null;let es=P_emps(t);
 if(me.role==='employee'){if(es.some(e=>e.id!==me.empId))return{deny:true};return{e:self}}
 if(!es.length&&/\b(my|me|mine|myself|i)\b/.test(t)&&self)es=[self];

function preChecks(ym){const items=[];const ds=monthDates(ym).filter(d=>d<TODAY);
 const mp=[];active().forEach(e=>ds.forEach(d=>{if(evalDay(e,d).code==='MP')mp.push({e,d})}));

 return items}

function md(txt){const lines=esc(txt).split(/\n/);let html='',list=null;const inline=s=>s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
 for(const l of lines){const ul=l.match(/^\s*[-*•]\s+(.*)/),ol=l.match(/^\s*\d+[.)]\s+(.*)/);const want=ul?'ul':ol?'ol':null;
  if(want!==list){if(list)html+=`</${list}>`;if(want)html+=`<${want}>`;list=want}
  if(want)html+=`<li>${inline((ul||ol)[1])}</li>`;else if(l.trim())html+=`<p>${inline(l)}</p>`}
 if(list)html+=`</${list}>`;return html}

function iCalc(t){const S=DB.settings,k=CALC_TOPIC(t),go2=(id,p)=>[{label:'Read in manual',ic:'book',act:'manual',args:{id}},...(p&&can(p)?[{label:'Open '+PAGE_INFO[p][0],nav:p}]:[])];

  pt:{h:`<b>Professional Tax</b> is deducted monthly from the slab that the month's gross falls in:${tbl(['Gross up to','PT / month'],S.ptSlabs.slice().sort((a,b)=>a.upto-b.upto).map(s=>[s.upto>=1e8?'above':inr(s.upto),inr(s.amt)]),[1])}<span class="small muted">These are sample slabs — set your state's rates in Settings.</span>`,b:go2('statutory','settings')},

  this.history.push({role:'ai',ts:Date.now(),...out});this.persist();this.paint()},

 clickBtn(mi,bi){const b=this.history[mi]?.buttons?.[bi];if(!b)return;if(b.q)return this.ask(b.q);if(b.nav){if(b.set)Object.assign(state,b.set);const fromPage=state.page==='assistant';if(innerWidth<860)this.toggle(false);go(b.nav);if(fromPage&&innerWidth>=860)this.toggle(true);return}if(b.act&&ACTS[b.act])ACTS[b.act](b.args||{})},
 submit(ev,form){ev.preventDefault();const ta=form.querySelector('textarea');const q=ta.value;ta.value='';this.ask(q)},
 mic(btn){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('Voice input is not supported in this browser');const rec=new SR();rec.lang='en-IN';rec.interimResults=false;btn.classList.add('rec');

 msgHTML(m,i){if(m.role==='user')return`<div class="msg user"><div class="bubble">${esc(m.text)}</div></div>`;

  const btns=m.buttons&&m.buttons.length?`<div class="ai-btns">${m.buttons.map((b,j)=>`<button class="btn sm" onclick="AI.clickBtn(${i},${j})">${b.ic?I(b.ic,'sm'):''}${esc(b.label)}</button>`).join('')}</div>`:'';
  return`<div class="msg ai"><div class="ai-av">${svg('ai','')}</div><div class="bubble">${m.html}${conf}${btns}</div></div>`},
 containers(){return[...document.querySelectorAll('.ai-chat')]},
 mount(el){if(el.dataset.mounted)return;el.dataset.mounted='1';const voice=!!(window.SpeechRecognition||window.webkitSpeechRecognition);
  el.innerHTML=`<div class="ai-msgs"></div><div class="ai-chips"></div><form class="ai-input" onsubmit="AI.submit(event,this)">${voice?`<button type="button" class="icon-btn" onclick="AI.mic(this)" title="Speak">${svg('mic')}</button>`:''}<textarea placeholder="Ask or tell me what to do…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();this.form.requestSubmit()}"></textarea><button class="btn ai" title="Send" style="height:44px">${svg('send')}</button></form>`},

 <div class="card"><h3>How it works</h3><ul class="small" style="padding-left:18px;margin:0;line-height:1.7"><li>Reads the same JSON data as every screen, live.</li><li>Changes (payroll, leave, roster, punches, salary) always show a <b>Confirm</b> card first.</li><li>Every confirmed action is in the <b>Audit Log</b> as “AI Assistant”.</li><li>Respects your role — employees only see their own data.</li><li>Mode: <b>${DB.ai.mode==='hybrid'?'Built-in + external AI':'Built-in (offline)'}</b>${can('settings')?' · change in Settings':''}.</li></ul></div></div></div>`}

 {id:'attendance-rules',title:'Late, early, half-day & overtime rules',ic:'clock',page:'attendance',keywords:'late grace early out half day overtime ot rules minutes blocks multiplier calculation',

  steps:['<b>Late</b>: in-punch more than the grace period (default 10 min) after shift start.','<b>Early out</b>: out-punch more than the grace before shift end.','<b>Half day</b>: worked (after break) less than 60% of the shift\'s net hours.','<b>OT</b>: time beyond shift end, if at least 30 min, counted in 30-minute blocks. On weekly offs and holidays all worked time is OT.'],

  doIt:()=>['Sync all devices','Which devices are offline?'],
  body:`<h4>How the production connector works</h4><p>A small service on the office network reads punches from each device — through the vendor SDK (eSSL / ZKTeco use TCP port 4370), ADMS/iClock push, or the vendor's attendance database — and posts them to <code>POST /api/punches</code>. The first punch of the day is IN and the last is OUT.</p><h4>If a device is offline</h4><ol><li>Check power and the network cable / Wi-Fi.</li><li>Ping the device IP from the server and make sure port 4370 is open.</li><li>Devices keep punches in memory, so nothing is lost — the next successful sync pulls them.</li></ol>`},

/* ---------- router (clean URLs, no .html) ---------- */
const Router={mode:'hash',base:'/',
 init(){const m=APP.routerMode;this.mode=m!=='auto'?m:(location.protocol==='file:'?'hash':'path');
  if(this.mode==='path'){const mm=location.pathname.match(/^(.*\/)([^\/]*)$/)||['','/',''];let base=mm[1],seg=mm[2];
   if(/\.html?$/i.test(seg)){seg=seg.replace(/\.html?$/i,'');if(seg==='index')seg=''}
   if(!seg){const m2=base.match(/^(.*\/)([^\/]+)\/$/);if(m2&&isRoute(m2[2])){base=m2[1];seg=m2[2]}}
   this.base=base;const clean=base+seg;if(location.pathname!==clean)history.replaceState({},'',clean+location.search+location.hash);
   addEventListener('popstate',handleRoute)}else addEventListener('hashchange',handleRoute)},
 current(){if(this.mode==='path'){const p=decodeURIComponent(location.pathname);return p.startsWith(this.base)?p.slice(this.base.length).replace(/\/$/,'').replace(/\.html?$/i,'').replace(/^index$/,''):''}return location.hash.replace(/^#\/?/,'').split('?')[0]},
 url(r){return this.mode==='path'?this.base+r:'#/'+r},
 go(r,replace){if(this.mode==='path'){if(this.current()!==r||replace)history[replace?'replaceState':'pushState']({},'',this.base+r);handleRoute()}
  else{const h='#/'+r;if(location.hash===h)handleRoute();else if(replace)location.replace(location.href.split('#')[0]+h);else location.hash=h}}};
function go(p){document.body.classList.remove('side-open');Router.go(p);window.scrollTo(0,0)}

 state.page=!PAGE_INFO[r]||r==='404'||r==='403'?'404':can(r)?r:'403';

/* ---------- session & auth ---------- */
const SKEY='attendpay_session',LKEY='attendpay_lock';
function readSess(){try{return JSON.parse(sessionStorage.getItem(SKEY)||'null')||JSON.parse(localStorage.getItem(SKEY)||'null')}catch(e){return null}}
function writeSess(){if(!SESSION)return;const s=JSON.stringify({uid:SESSION.user.id,rem:SESSION.rem,at:SESSION.at,last:SESSION.last});try{(SESSION.rem?localStorage:sessionStorage).setItem(SKEY,s)}catch(e){}}
function clearSess(){try{sessionStorage.removeItem(SKEY);localStorage.removeItem(SKEY)}catch(e){}}
function restoreSession(){const s=readSess();if(!s)return null;const u=DB.users.find(x=>x.id===s.uid&&x.active);if(!u){clearSess();return null}
 const limit=s.rem?APP.rememberDays*864e5:APP.idleMinutes*6e4;if(Date.now()-s.last>limit){clearSess();LOGIN_MSG='Your session expired. Please sign in again.';return null}
 return{user:u,rem:s.rem,at:s.at,last:Date.now()}}
let _lastTouch=0;
function touchActivity(){if(!SESSION)return;const n=Date.now();if(n-_lastTouch<15000)return;_lastTouch=n;SESSION.last=n;writeSess()}
function checkIdle(){if(SESSION&&!SESSION.rem&&Date.now()-SESSION.last>APP.idleMinutes*6e4){VIA='System';log('Session expired','Idle for '+APP.idleMinutes+' min');VIA='UI';save();logout('You were signed out after '+APP.idleMinutes+' minutes of inactivity.')}}
function getLock(){try{return JSON.parse(localStorage.getItem(LKEY)||'{"fails":0,"until":0}')}catch(e){return{fails:0,until:0}}}
function setLock(o){try{localStorage.setItem(LKEY,JSON.stringify(o))}catch(e){}}
function doLogin(ev){ev.preventDefault();const err=$('#lg_err'),show=m=>{err.textContent=m;err.classList.add('show')};
 const lk=getLock();if(lk.until>Date.now())return show(`Too many failed attempts. Try again in ${Math.ceil((lk.until-Date.now())/1000)} seconds.`),false;
 const un=$('#lg_user').value.trim().toLowerCase(),pw=$('#lg_pass').value,rem=$('#lg_rem').checked;
 const u=DB.users.find(x=>x.username.toLowerCase()===un);
 if(!u||!checkPw(u,pw)){lk.fails=(lk.until&&lk.until<Date.now()?0:lk.fails)+1;lk.until=0;if(lk.fails>=APP.maxLoginAttempts){lk.until=Date.now()+APP.lockSeconds*1000;lk.fails=0}setLock(lk);
  VIA='System';DB.audit.unshift({at:new Date().toISOString(),user:un||'(blank)',action:'Login failed',detail:u?'Wrong password':'Unknown username',via:'System'});VIA='UI';save();
  const left=APP.maxLoginAttempts-lk.fails;show(lk.until?`Too many failed attempts. Sign-in is locked for ${APP.lockSeconds} seconds.`:`Invalid username or password.${left<=2?` ${left} attempt${left>1?'s':''} left.`:''}`);$('#lg_pass').value='';$('#lg_pass').focus();return false}
 if(!u.active)return show('This account is disabled. Contact your administrator.'),false;
 setLock({fails:0,until:0});u.lastLogin=new Date().toISOString();
 SESSION={user:u,rem,at:Date.now(),last:Date.now()};writeSess();log('Signed in',ROLES[u.role].label+(rem?' · remember me':''));save();
 AI.load();const dest=NEXT&&can(NEXT)?NEXT:homeFor(u);NEXT='';Router.go(dest,true);toast(`Welcome, ${u.name}!`);return false}
function logout(msg){if(SESSION){log('Signed out',msg&&msg.includes('inactivity')?'Idle timeout':'');save()}SESSION=null;clearSess();AI.clear();closeModal();LOGIN_MSG=msg||'You have been signed out.';document.body.classList.remove('side-open');Router.go('login')}

 $('#nav').innerHTML=navHTML();
 const pg=PAGES.find(x=>x[0]===p),home=homeFor(SESSION.user);
 $('#ph').innerHTML=`<div class="grow"><div class="crumbs"><a onclick="go('${home}')">Home</a>${pg?` › ${pg[3]}`:''} › ${esc(info[0])}</div><h1>${esc(info[0])}</h1>${info[1]?`<p>${esc(info[1])}</p>`:''}</div>
  <div class="ph-actions"><span id="saved" class="badge b-ok">Saved</span>${p!=='assistant'&&p!=='404'&&p!=='403'?`<button class="btn sm" onclick="AI.toggle(true)">${I('ai')} AI help for this page</button>`:''}</div>`;
 const fn=PAGE_FN[p]||pg404;$('#main').innerHTML=fn();if(fn._after)fn._after();if(p==='assistant')pgAssistant._after();if(p==='manual')pgManual._after();
 paintBell();AI.syncFab();AI.paintChips()}
function render(){if(SESSION&&$('#main'))renderPage()}
function navHTML(){let out='',sec='';for(const[id,label,ic,s]of PAGES){if(!can(id))continue;if(s!==sec){out+=`<div class="sec">${s}</div>`;sec=s}
 out+=`<a href="${Router.url(id)}" class="${state.page===id?'active':''}" onclick="return navClick(event,'${id}')" title="${label}">${svg(ic)}<span class="lbl">${label}</span>${id==='assistant'?'<span class="tag">AI</span>':''}</a>`}return out}
function toggleSide(){if(innerWidth<=860){document.body.classList.toggle('side-open');return}document.body.classList.toggle('side-mini');try{localStorage.setItem('attendpay_side',document.body.classList.contains('side-mini')?'mini':'full')}catch(e){}}

/* ---------- theme ---------- */
function initTheme(){let t=null;try{t=localStorage.getItem('attendpay_theme')}catch(e){}if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t}
function toggleTheme(force){const t=force||(document.documentElement.dataset.theme==='dark'?'light':'dark');document.documentElement.dataset.theme=t;try{localStorage.setItem('attendpay_theme',t)}catch(e){}paintThemeBtn();render()}
function paintThemeBtn(){const b=$('#themeBtn');if(b)b.innerHTML=svg(document.documentElement.dataset.theme==='dark'?'sun':'moon')}

/* ---------- dropdowns, notifications, search ---------- */
function toggleDD(k){const el=$('#dd-'+k),open=el.classList.contains('open');closeDD();if(!open){if(k==='notif')paintNotif();el.classList.add('open')}}
function closeDD(){document.querySelectorAll('.dropdown.open').forEach(d=>d.classList.remove('open'))}
function notifications(){const n=[],pm=prevMonth(TODAY.slice(0,7));
 if(can('leave')){const p=DB.leaves.filter(l=>l.status==='Pending');if(p.length)n.push({ic:'leave',t:`${p.length} leave request${p.length>1?'s':''} awaiting approval`,s:p.slice(0,3).map(l=>empById(l.empId)?.name).join(', '),page:'leave'})}
 if(can('devices')){const off=DB.devices.filter(d=>d.status!=='Online');if(off.length)n.push({ic:'dev',t:`${off.length} biometric device${off.length>1?'s':''} offline`,s:off.map(d=>d.name).join(', '),page:'devices'})}
 if(can('attendance')){const mp=missedPunches(7);if(mp.length)n.push({ic:'alertCircle',t:`${mp.length} missed punch${mp.length>1?'es':''} in the last 7 days`,s:'Correct them before running payroll',page:'attendance'});const st=absentStreaks();if(st.length)n.push({ic:'flag',t:`${st.map(x=>x.e.name).join(', ')} absent ${st[0].n}+ days in a row`,s:'Check with the supervisor',page:'attendance'})}
 if(can('payroll')){const run=DB.payroll[pm];if(!run)n.push({ic:'pay',t:`Payroll for ${monthName(pm)} not processed`,s:'Run it from Payroll Run or ask the AI',page:'payroll',set:{payMonth:pm}});else if(run.status!=='Locked')n.push({ic:'lock',t:`Payroll for ${monthName(pm)} is in Draft`,s:'Lock it to publish payslips',page:'payroll',set:{payMonth:pm}})}
 if(can('employees')){const mi=missingIds();if(mi.length)n.push({ic:'idcard',t:`${mi.length} employee${mi.length>1?'s':''} missing statutory details`,s:mi.map(x=>x.e.name+': '+x.m.join('/')).join(', '),page:'employees'})}
 if(SESSION.user.role==='employee'){const e=SESSION.user.empId;DB.leaves.filter(l=>l.empId===e&&l.status!=='Pending'&&l.from>=addDays(TODAY,-30)).forEach(l=>n.push({ic:l.status==='Approved'?'checkCircle':'xCircle',t:`Your ${l.type} leave on ${fmtDate(l.from)} was ${l.status.toLowerCase()}`,page:'ess',set:{essTab:'leave'}}));
  const lr=Object.keys(DB.payroll).sort().reverse().find(m=>DB.payroll[m].status==='Locked');if(lr)n.push({ic:'file',t:`Payslip for ${monthName(lr)} is available`,page:'ess',set:{essTab:'pay'}})}
 return n}
let NOTIF=[];
function paintBell(){NOTIF=notifications();const c=$('#bellCount');if(c){c.textContent=NOTIF.length;c.style.display=NOTIF.length?'':'none'}}
function paintNotif(){paintBell();$('#dd-notif').innerHTML=`<div class="dd-head">Notifications<span class="badge b-info" style="margin-left:auto">${NOTIF.length}</span></div><div class="dd-list">${NOTIF.length?NOTIF.map((x,i)=>`<a class="dd-item" onclick="openNotif(${i})"><span class="ic">${I(x.ic)}</span><div>${esc(x.t)}${x.s?`<small>${esc(x.s)}</small>`:''}</div></a>`).join(''):'<div class="dd-item muted">You\'re all caught up</div>'}</div>
 <div class="dd-item" style="justify-content:center;color:var(--brand)" onclick="closeDD();AI.ask('What needs attention?')">${I('ai')} Ask the assistant what needs attention</div>`}
function openNotif(i){const x=NOTIF[i];closeDD();if(x.set)Object.assign(state,x.set);go(x.page)}
let SEARCH=[],SEL=0;
function gSearch(v){const q=v.trim().toLowerCase(),dd=$('#dd-search');if(!q){dd.classList.remove('open');return}
 const res=[];
 PAGES.filter(p=>can(p[0])&&(p[1]+' '+p[3]).toLowerCase().includes(q)).slice(0,4).forEach(p=>res.push({g:'Pages',ic:svg(p[2]),t:p[1],s:p[3],run:()=>go(p[0])}));
 if(can('employees')||can('attendance'))DB.employees.filter(e=>(e.name+' '+e.code+' '+e.designation).toLowerCase().includes(q)).slice(0,5).forEach(e=>res.push({g:'Employees',ic:`<span class="avatar" style="width:22px;height:22px;font-size:9px">${initials(e.name)}</span>`,t:e.name,s:`${e.code} · ${e.designation} · ${e.dept}`,run:()=>can('employees')?empForm(e.id):AI.ask('Details of '+e.code)}));
 MANUAL.filter(m=>(m.title+' '+m.keywords).toLowerCase().includes(q)).slice(0,3).forEach(m=>res.push({g:'Help',ic:svg('book'),t:m.title,s:'User manual',run:()=>openManual(m.id)}));
 res.push({g:'AI assistant',ic:svg('ai'),t:`Ask AI: “${v.trim()}”`,s:'Get an answer or run it as a command',run:()=>AI.ask(v.trim())});
 SEARCH=res;SEL=0;let g='';dd.innerHTML='<div class="dd-list">'+res.map((r,i)=>{const h=r.g!==g?`<div class="dd-label">${r.g}</div>`:'';g=r.g;return h+`<a class="dd-item ${i===0?'sel':''}" onmousedown="event.preventDefault();pickSearch(${i})"><span class="ic">${r.ic}</span><div>${esc(r.t)}<small>${esc(r.s)}</small></div></a>`}).join('')+'</div>';dd.classList.add('open')}
function pickSearch(i){const r=SEARCH[i];if(!r)return;const inp=$('#gsearch');inp.value='';inp.blur();closeDD();r.run()}
function gKey(e){const items=[...document.querySelectorAll('#dd-search .dd-item')];if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();SEL=(SEL+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;items.forEach((x,i)=>x.classList.toggle('sel',i===SEL))}else if(e.key==='Enter'){e.preventDefault();pickSearch(SEL)}else if(e.key==='Escape'){e.target.blur();closeDD()}}

/* ---------- boot ---------- */
function boot(){initTheme();DB=load()||seed();ensureSchema(DB);save();setFavicon();Router.init();SESSION=restoreSession();if(SESSION)AI.load();
 handleRoute();setInterval(checkIdle,30000);
 ['click','keydown','mousemove','touchstart','scroll'].forEach(ev=>document.addEventListener(ev,touchActivity,{passive:true}));
 document.addEventListener('click',e=>{if(!e.target.closest('.dd-wrap')&&!e.target.closest('.search'))closeDD()});
 document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'&&SESSION){e.preventDefault();$('#gsearch')?.focus()}
  if(e.key==='Escape'){if(!$('#modal').classList.contains('hidden'))closeModal();else if(AI.open)AI.toggle(false);closeDD()}});
 addEventListener('storage',e=>{if(e.key===APP.key&&e.newValue){try{DB=ensureSchema(JSON.parse(e.newValue));if(SESSION){SESSION.user=DB.users.find(u=>u.id===SESSION.user.id)||SESSION.user;render()}}catch(x){}}})}
if(typeof document!=='undefined'&&document.getElementById('root'))boot();

</script>
</body>
</html>
