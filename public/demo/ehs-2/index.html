<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voltech HSE Platform</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: compact charcoal sidebar + white working surface; orange = action/attention, teal = info/positive highlight */
[hidden]{display:none!important}
:root{
  --bg:#EDF1F4; --surface:#FFFFFF; --surface-2:#F8F9FA; --ink:#1D2125; --ink-2:#4F575E; --muted:#868E95; --line:#E2E5E8; --line-2:#CDD2D6;
  --side:#1B1F23; --side-2:#24292E; --side-ink:#C9CED3; --side-muted:#7D858C;
  --accent:#F06A1A; --accent-ink:#1B1F23; --accent-soft:#FDEBDD; --accent-text:#B9480A;
  --teal:#0E8487; --teal-soft:#DDF1F1; --teal-text:#0A6466;
  --ok:#2D8A4E; --ok-soft:#E1F2E7; --warn:#B98000; --warn-soft:#FBF0D3; --bad:#CC3A28; --bad-soft:#FBE3DF; --info:#3A6EA5; --info-soft:#E2ECF6;
  --shadow:0 1px 2px rgba(20,24,28,.06),0 4px 14px rgba(20,24,28,.05);
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111416; --surface:#191D20; --surface-2:#1F2427; --ink:#E7EAEC; --ink-2:#B3BAC0; --muted:#828B92; --line:#2A3035; --line-2:#3A4248;
  --side:#0C0E10; --side-2:#171B1E; --side-ink:#C9CED3; --side-muted:#737B82;
  --accent:#FF7A2E; --accent-ink:#141618; --accent-soft:#3A2416; --accent-text:#FF9A5C;
  --teal:#2BB0AE; --teal-soft:#13302F; --teal-text:#5FD0CD;
  --ok:#4DB872; --ok-soft:#16301F; --warn:#E0A92A; --warn-soft:#352A10; --bad:#F06450; --bad-soft:#3A1A15; --info:#6FA2DA; --info-soft:#18283A;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111416; --surface:#191D20; --surface-2:#1F2427; --ink:#E7EAEC; --ink-2:#B3BAC0; --muted:#828B92; --line:#2A3035; --line-2:#3A4248;
  --side:#0C0E10; --side-2:#171B1E; --side-ink:#C9CED3; --side-muted:#737B82;
  --accent:#FF7A2E; --accent-ink:#141618; --accent-soft:#3A2416; --accent-text:#FF9A5C;
  --teal:#2BB0AE; --teal-soft:#13302F; --teal-text:#5FD0CD;
  --ok:#4DB872; --ok-soft:#16301F; --warn:#E0A92A; --warn-soft:#352A10; --bad:#F06450; --bad-soft:#3A1A15; --info:#6FA2DA; --info-soft:#18283A;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:13.5px;line-height:1.45;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.92em;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:.01em}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;min-height:0;padding-left:env(safe-area-inset-left,0px)}
.brand{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--side-line,rgba(255,255,255,.06));min-height:62px}
.brand-mark{width:30px;height:30px;flex:none;display:grid;place-items:center;background:var(--accent);color:#1B1F23;border-radius:4px;font-family:var(--f-display);font-weight:800;font-size:17px;clip-path:polygon(0 0,100% 0,100% 72%,72% 100%,0 100%)}
.brand-t{font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--side-strong,#fff);letter-spacing:.02em;line-height:1.1}
.brand-s{font-size:10.5px;color:var(--side-muted);letter-spacing:.12em;text-transform:uppercase}
.nav{flex:1;overflow-y:auto;padding:10px 8px 20px;scrollbar-width:thin}
.nav-sec{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--side-muted);padding:14px 10px 6px}
.nav-g{margin:1px 0}
.nav-h{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border:0;background:none;border-radius:5px;cursor:pointer;text-align:left;color:var(--side-ink);font-size:13px}
.nav-h:hover{background:var(--side-2);color:var(--side-strong,#fff)}
.nav-h svg{width:16px;height:16px;flex:none;opacity:.85}
.nav-h .chev{margin-left:auto;width:12px;height:12px;transition:transform .15s;opacity:.5}
.nav-g.open .chev{transform:rotate(90deg)}
.nav-h.active{background:var(--side-2);color:var(--side-strong,#fff);box-shadow:inset 3px 0 0 var(--accent)}
.nav-sub{display:none;padding:2px 0 6px 36px}
.nav-g.open .nav-sub{display:block}
.nav-sub a{display:block;padding:5px 10px;border-radius:4px;color:var(--side-muted);text-decoration:none;font-size:12.5px;cursor:pointer}
.nav-sub a:hover{color:var(--side-strong,#fff)}
.nav-sub a.active{color:var(--side-strong,#fff);background:color-mix(in srgb,var(--accent) 18%,transparent)}
.nav-sub a.active::before{content:"";display:inline-block;width:5px;height:5px;background:var(--accent);margin:0 8px 2px -12px;border-radius:1px}
.side-foot{padding:12px 16px;border-top:1px solid var(--side-line,rgba(255,255,255,.06));white-space:nowrap;overflow:hidden;font-size:11px;color:var(--side-muted)}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));position:relative;z-index:5}

.crumbs{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.crumbs b{color:var(--ink);font-weight:600}
.scope{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap}
.scope label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.top-user{display:flex;align-items:center;gap:8px;padding-left:12px;border-left:1px solid var(--line)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--teal-soft);color:var(--teal-text);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.top-user small{display:block;color:var(--muted);font-size:11px;line-height:1.1}
.content{flex:1;overflow-y:auto;padding-block:20px 48px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
.demo-banner{background:var(--accent-soft);color:var(--accent-text);font-size:11.5px;padding:5px 20px;text-align:center;letter-spacing:.02em}

/* ---------- Page header ---------- */
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph-t{min-width:0;flex:1 1 320px}
.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-text);font-weight:600;margin-bottom:4px}
.ph h1{font-size:26px;font-weight:700;line-height:1.1}
.ph p{margin:6px 0 0;color:var(--ink-2);max-width:70ch}
.ph-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Primitives ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:5px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn svg{width:14px;height:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.05)}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{border:0;background:none;cursor:pointer;padding:6px;border-radius:5px;color:inherit;display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:18px;height:18px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:15px;font-weight:600}
.card-h .sub{color:var(--muted);font-size:12px}
.card-h .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.card-b{padding:14px 16px}
.card-b.flush{padding:0}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-dash{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-split{grid-template-columns:300px minmax(0,1fr)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:500;white-space:nowrap;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.pill.nodot::before{display:none}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.pill.teal{background:var(--teal-soft);color:var(--teal-text);border-color:transparent}
.pill.orange{background:var(--accent-soft);color:var(--accent-text);border-color:transparent}
.tag{display:inline-block;font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}

.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.t td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr:hover td{background:var(--surface-2)}
.t td.r,.t th.r{text-align:right}
.t .strong{font-weight:600}
.t .mono{white-space:nowrap}
.t .num{white-space:nowrap}
.t .muted{color:var(--muted);font-size:12px}
.t tr.click{cursor:pointer}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.input,select.input,textarea.input{width:100%;padding:7px 10px;border:1px solid var(--line-2);border-radius:5px;background:var(--surface);font-size:13px}
.input:focus{border-color:var(--teal);outline:none;box-shadow:0 0 0 3px var(--teal-soft)}
.input[readonly]{background:var(--surface-2);color:var(--ink-2)}
select.sm{padding:5px 8px;font-size:12.5px;width:auto;border:1px solid var(--line-2);border-radius:5px;background:var(--surface)}
.form-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tab{padding:9px 14px;border:0;background:none;cursor:pointer;font-size:13px;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .count{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-left:4px}

.callout{display:flex;gap:12px;padding:12px 14px;border-radius:var(--r);background:var(--teal-soft);color:var(--ink);border:1px solid transparent;font-size:13px}
.callout svg{width:18px;height:18px;flex:none;color:var(--teal-text);margin-top:1px}
.callout.orange{background:var(--accent-soft)}
.callout.orange svg{color:var(--accent-text)}
.callout b{font-weight:600}

/* ---------- KPI tiles ---------- */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;position:relative;min-width:0}
.kpi-l{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.kpi-v{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.05;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi-v small{font-size:15px;color:var(--muted);font-weight:600;margin-left:2px}
.kpi-d{font-size:11.5px;margin-top:4px;color:var(--ink-2)}
.kpi-d .up{color:var(--ok)} .kpi-d .dn{color:var(--bad)}
.kpi.hero{background:var(--side);border-color:var(--side);color:#fff}
.kpi.hero .kpi-l{color:#9AA2A9}
.kpi.hero .kpi-d{color:#C9CED3}
.kpi.hero::after{content:"";position:absolute;right:0;top:0;bottom:0;width:6px;background:repeating-linear-gradient(-45deg,var(--accent) 0 6px,#1B1F23 6px 12px);border-radius:0 var(--r) var(--r) 0}

/* bars */
.hbar{display:grid;grid-template-columns:150px minmax(0,1fr) 46px;gap:10px;align-items:center;padding:5px 0;font-size:12.5px}
.hbar .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .trk{height:10px;background:var(--surface-2);border-radius:2px;position:relative;border:1px solid var(--line)}
.hbar .fill{position:absolute;inset:0 auto 0 0;border-radius:0 4px 4px 0;background:var(--teal)}
.hbar .tgt{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.5}
.hbar .val{text-align:right;font-family:var(--f-mono);font-size:12px}
.chart-tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;padding:6px 9px;border-radius:4px;z-index:100;white-space:nowrap;box-shadow:var(--shadow)}

/* list items */
.li{display:flex;gap:12px;align-items:flex-start;padding:10px 16px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li-ic{width:32px;height:32px;border-radius:5px;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--ink-2)}
.li-ic svg{width:16px;height:16px}
.li-b{min-width:0;flex:1}
.li-t{font-weight:600;font-size:13px}
.li-s{color:var(--muted);font-size:12px}
.date-chip{width:40px;flex:none;text-align:center;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.date-chip .m{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;background:var(--surface-2);color:var(--muted);padding:1px 0}
.date-chip .d{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.4}

/* ---------- Site hierarchy ---------- */
.tree{font-size:13px;padding:8px}
.tree-n{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:5px;cursor:pointer}
.tree-n:hover{background:var(--surface-2)}
.tree-n.on{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.tree-n svg{width:14px;height:14px;flex:none;color:var(--muted)}
.tree-n .tc{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.tree-l1{padding-left:18px}
.tree-l2{padding-left:36px}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 14px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.lockbox{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px dashed var(--teal);border-radius:var(--r);background:var(--teal-soft)}
.lockbox svg{width:16px;height:16px;color:var(--teal-text);flex:none}
.lockbox .mono{font-size:13px;font-weight:500}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;padding:0 0 14px 20px;font-size:12.5px}
.timeline li::before{content:"";position:absolute;left:4px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.timeline li::after{content:"";position:absolute;left:7px;top:14px;bottom:0;width:1px;background:var(--line)}
.timeline li:last-child::after{display:none}
.timeline li.hl::before{background:var(--accent)}
.timeline .when{color:var(--muted);font-size:11.5px}

/* ---------- Inspection ---------- */
.heat{border-collapse:separate;border-spacing:3px;font-size:12px;width:100%}
.heat th{font-weight:600;font-size:11px;color:var(--muted);text-align:center;padding:4px}
.heat th.sl{text-align:left;color:var(--ink);font-size:12.5px;white-space:nowrap}
.heat td{text-align:center;height:34px;border-radius:3px;font-family:var(--f-mono);font-size:12px;min-width:58px;cursor:default}
.heat td.na{background:var(--surface-2);color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-2px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.filters .field{flex:1 1 150px}
.chk-sec{border-top:1px solid var(--line)}
.chk-sec:first-child{border-top:0}
.chk-sec h4{font-size:13.5px;font-weight:600;padding:10px 16px;background:var(--surface-2);display:flex;align-items:center;gap:8px;font-family:var(--f-body)}
.chk-sec h4 .tag{margin-left:auto}
.chk{display:flex;align-items:center;gap:12px;padding:8px 16px;border-top:1px solid var(--line);font-size:13px}
.chk .q{flex:1;min-width:0}
.chk .ref{font-family:var(--f-mono);font-size:11px;color:var(--muted);width:34px;flex:none}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:5px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--surface);padding:4px 10px;font-size:12px;cursor:pointer;border-left:1px solid var(--line-2)}
.seg button:first-child{border-left:0}
.seg button.y{background:var(--ok);color:#fff}
.seg button.n{background:var(--bad);color:#fff}
.seg button.na{background:var(--line-2);color:var(--ink)}
.chk.new .q::after{content:"NEW THIS REV";font-size:9.5px;letter-spacing:.08em;font-weight:700;color:var(--accent-text);background:var(--accent-soft);padding:1px 5px;border-radius:3px;margin-left:8px;vertical-align:1px}
.diff{list-style:none;margin:0;padding:0;font-size:12.5px}
.diff li{display:flex;gap:8px;padding:3px 0}
.diff .op{font-family:var(--f-mono);font-weight:700;width:14px;flex:none;text-align:center}
.diff .add{color:var(--ok)} .diff .mod{color:var(--warn)} .diff .del{color:var(--bad)}
.rev{padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.rev:hover{background:var(--surface-2)}
.rev.on{background:var(--accent-soft)}
.rev:last-child{border-bottom:0}
.scorebar{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.scorebar div{height:100%;background:var(--teal)}

/* ---------- Permits ---------- */
.ptypes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.ptype{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.ptype:hover{border-color:var(--ink-2)}
.ptype svg{width:22px;height:22px;color:var(--ink-2)}
.ptype b{font-size:13px;font-weight:600;line-height:1.2}
.ptype small{color:var(--muted);font-size:11px;font-family:var(--f-mono)}
.ptype.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.ptype.on svg{color:var(--accent-text)}
.hazard-strip{height:6px;background:repeating-linear-gradient(-45deg,var(--accent) 0 8px,var(--ink) 8px 16px);border-radius:var(--r) var(--r) 0 0}
.prec{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.prec label{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:5px;font-size:12.5px;cursor:pointer;background:var(--surface)}
.prec label:has(input:checked){border-color:var(--ok);background:var(--ok-soft)}
.prec input{margin-top:2px;accent-color:var(--ok)}
.steps{display:flex;gap:0;list-style:none;margin:0;padding:0;counter-reset:s;flex-wrap:wrap}
.steps li{flex:1 1 120px;position:relative;padding:10px 12px 10px 38px;font-size:12px;border-top:3px solid var(--line);color:var(--muted);min-width:0}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:10px;top:9px;width:20px;height:20px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line-2);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--ink-2)}
.steps li b{display:block;color:var(--ink);font-size:12.5px}
.steps li.done{border-top-color:var(--ok)}
.steps li.done::before{content:"✓";background:var(--ok);border-color:var(--ok);color:#fff}
.steps li.cur{border-top-color:var(--accent)}
.steps li.cur::before{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.gas{width:100%;border-collapse:collapse;font-size:13px}
.gas td,.gas th{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left}
.gas th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.gas input{width:90px}
.meter{height:12px;border-radius:2px;background:var(--surface-2);border:1px solid var(--line);position:relative;overflow:hidden}
.meter div{position:absolute;inset:0 auto 0 0}

/* ---------- Calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--line);border-top:1px solid var(--line)}
.cal .dh{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface-2)}
.cal .dc{min-height:96px;padding:5px 6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .dc.out{background:var(--surface-2)}
.cal .dc.out .dn{color:var(--line-2)}
.cal .dn{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2)}
.cal .dc.today .dn{background:var(--accent);color:var(--accent-ink);border-radius:3px;padding:0 5px;align-self:flex-start;font-weight:600}
.ev{font-size:11px;line-height:1.25;padding:3px 5px;border-radius:3px;border-left:3px solid;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.planned{background:var(--info-soft);border-color:var(--info);color:var(--ink)}
.ev.completed{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.ev.overdue{background:var(--bad-soft);border-color:var(--bad);color:var(--ink)}
.ev.event{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}

/* risk matrix */
.rm{display:grid;grid-template-columns:28px repeat(5,minmax(0,1fr));gap:3px;font-size:12px}
.rm .ax{display:grid;place-items:center;color:var(--muted);font-family:var(--f-mono);font-size:11px}
.rm .cell{aspect-ratio:1.5;display:grid;place-items:center;border-radius:3px;font-family:var(--f-mono);font-weight:600;cursor:pointer;border:2px solid transparent;max-width:100%}
.rm .cell.sel{border-color:var(--ink)}
.rm .cell small{display:block;font-weight:400;font-size:10px;opacity:.8}
.r-low{background:var(--ok-soft);color:var(--ok)}
.r-med{background:var(--warn-soft);color:var(--warn)}
.r-high{background:var(--accent-soft);color:var(--accent-text)}
.r-ext{background:var(--bad-soft);color:var(--bad)}
.rscore{display:inline-grid;place-items:center;min-width:28px;height:22px;border-radius:3px;font-family:var(--f-mono);font-weight:600;font-size:12px;padding:0 4px}

/* modal/toast */
.scrim{position:fixed;inset:0;background:rgba(15,18,20,.5);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:8px;width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal-h h3{font-size:18px}
.modal-b{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--side);color:#fff;padding:12px 16px;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:60;max-width:min(420px,calc(100vw - 40px));font-size:13px;display:flex;gap:10px;border-left:4px solid var(--teal)}
.toast svg{width:18px;height:18px;flex:none;color:var(--teal)}

.empty{padding:28px;text-align:center;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:12px}
.mt{margin-top:14px}
.hide-sm{}

@media (max-width:1280px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.ptypes{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:1024px){.g-rm,.g-cal{grid-template-columns:minmax(0,1fr)!important}.g-dash,.g-split,.g2,.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:260px;z-index:40;transform:translateX(-100%);transition:transform .2s}
  .app.nav-open .side{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.4)}
  .g-rm,.g-cal{grid-template-columns:minmax(0,1fr)!important}
  .card-h{flex-wrap:wrap}
  .card-h .r{margin-left:0}
  .scope label,.top-user div,.hide-sm{display:none}
  .top{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));flex-wrap:wrap}
  .scope{order:3;width:100%;margin-left:0}
  .scope select{flex:1;min-width:0}
  .content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ptypes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hbar{grid-template-columns:96px minmax(0,1fr) 40px}
  .kv{grid-template-columns:minmax(0,1fr)}
  .kv dt{margin-top:6px}
  .cal .dc{min-height:64px}
  .ev{font-size:0;padding:0;height:6px;border-left-width:0}
  .chk{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* =================== v2: sign-in =================== */
.login{position:fixed;inset:0;z-index:80;background:var(--surface);overflow:auto}
.lg{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);min-height:100%}
.lg-brand{position:relative;background:var(--hero,#16191C);color:#E9ECEE;padding-block:36px 0;padding-left:max(48px,env(safe-area-inset-left,0px));padding-right:48px;display:flex;flex-direction:column;gap:26px;overflow:hidden;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:28px 28px}
.lg-stripe{position:absolute;left:0;right:0;top:0;height:8px;background:repeating-linear-gradient(-45deg,var(--accent) 0 12px,var(--hero,#16191C) 12px 24px)}
.lg-top{display:flex;align-items:center;gap:12px}
.lg-top .brand-t{color:#fff}
.lg-eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#5FD0CD;font-weight:600;margin-bottom:14px}
.lg-copy h1{font-size:clamp(38px,4.6vw,64px);line-height:.98;font-weight:800;color:#fff;letter-spacing:-.005em}
.lg-copy h1 span{color:var(--accent)}
.lg-copy p{color:#AEB5BB;font-size:15px;max-width:44ch;margin:16px 0 0}
.lg-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);border-radius:6px;overflow:hidden;max-width:560px}
.lg-stats div{background:#1B1F23;padding:12px 14px}
.lg-stats b{display:block;font-family:var(--f-display);font-size:28px;color:#fff;line-height:1;font-variant-numeric:tabular-nums}
.lg-stats span{font-size:11.5px;color:#949CA3}
.lg-slide{display:flex;gap:14px;align-items:flex-start;max-width:520px;min-height:78px}
.lg-slide-ic{width:38px;height:38px;border-radius:6px;background:rgba(240,106,26,.15);color:var(--accent);display:grid;place-items:center;flex:none}
.lg-slide-ic svg{width:19px;height:19px}
.lg-slide b{color:#fff;font-size:14px}
.lg-slide p{margin:3px 0 0;color:#A2AAB1;font-size:13px}
.lg-dots{display:flex;gap:6px;margin-top:-12px}
.lg-dots button{width:22px;height:4px;border:0;border-radius:2px;background:rgba(255,255,255,.18);cursor:pointer;padding:0}
.lg-dots button.on{background:var(--accent)}
.lg-art{color:#4A535B;margin-top:auto;width:100%;max-width:560px;display:block}
.lg-form-wrap{display:grid;place-items:center;padding-block:40px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));background:var(--surface)}
.lg-form{width:min(400px,100%);display:flex;flex-direction:column;gap:16px}
.lg-form h2{font-size:30px;font-weight:700}
.lg-form > p{margin:-10px 0 4px}
.lg-secure{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--teal-text);background:var(--teal-soft);padding:4px 10px;border-radius:20px;align-self:flex-start;font-weight:500}
.lg-secure svg{width:13px;height:13px}
.lg-who{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px dashed var(--line-2);border-radius:6px}
.lg-in{position:relative;display:flex;align-items:center}
.lg-in>svg{position:absolute;left:11px;width:16px;height:16px;color:var(--muted);pointer-events:none}
.lg-in .input{padding:11px 12px 11px 36px;font-size:14px}
.lg-eye{position:absolute;right:6px;border:0;background:none;color:var(--teal-text);font-size:12px;font-weight:600;cursor:pointer;padding:6px 8px}
.lg-link{color:var(--teal-text);cursor:pointer;font-weight:500}
.lg-go{justify-content:center;padding:12px;font-size:15px}
.lg-or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.lg-or::before,.lg-or::after{content:"";flex:1;height:1px;background:var(--line)}
.lg-sso{justify-content:center;padding:10px}
.lg-sso svg{width:16px;height:16px}
.lg-foot{text-align:center;margin:4px 0 0}
.lg-persona button{flex:1}

/* =================== v2: segmented, fields, chips =================== */
.segf{display:flex;border:1px solid var(--line-2);border-radius:6px;padding:3px;gap:3px;background:var(--surface-2);flex-wrap:wrap}
.segf button{flex:1 1 auto;border:0;background:none;padding:6px 10px;border-radius:4px;font-size:12.5px;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.segf button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12),inset 0 -2px 0 var(--accent)}
.ff{display:flex;flex-direction:column;gap:5px;min-width:0}
.ff > label{font-size:11.5px;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
.ff .req{color:var(--accent-text);font-style:normal;margin-left:3px}
.ff-hint{font-size:11.5px;color:var(--muted)}
.ff-err{font-size:11.5px;color:var(--bad);font-weight:500}
.ff.has-err .input,.ff.has-err .segf{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.ff.span2{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line-2);border-radius:20px;font-size:12px;cursor:pointer;font-family:var(--f-mono)}
.chip input{display:none}
.chip.on{background:var(--teal-soft);border-color:var(--teal);color:var(--teal-text)}

/* =================== v2: form sheet =================== */
.sheet{background:var(--surface);border-radius:10px;width:min(1000px,100%);height:min(760px,calc(100% - 8px));display:grid;grid-template-columns:250px minmax(0,1fr);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.sheet-rail{background:var(--side);color:#C9CED3;padding:24px 20px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;position:relative}
.sheet-rail::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:repeating-linear-gradient(-45deg,var(--accent) 0 8px,var(--side) 8px 16px)}
.rail-ic{width:52px;height:52px;border-radius:8px;background:rgba(240,106,26,.16);color:var(--accent);display:grid;place-items:center}
.rail-ic svg{width:26px;height:26px}
.rail-id{font-size:11.5px;color:#7D858C;letter-spacing:.04em}
.rail-name{font-family:var(--f-display);font-size:21px;font-weight:700;color:#fff;line-height:1.15;overflow-wrap:anywhere}
.sheet-rail .pill{align-self:flex-start}
.rail-prog{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08)}
.rail-prog .scorebar{background:rgba(255,255,255,.08);border-color:transparent}
.rail-kv{display:grid;gap:2px 0;margin:0;font-size:12px}
.rail-kv dt{color:#7D858C;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;margin-top:6px}
.rail-kv dd{margin:0;color:#E2E5E8;overflow-wrap:anywhere}
.rail-note{display:flex;gap:8px;font-size:12px;line-height:1.4;padding:10px;border-radius:6px;background:rgba(43,176,174,.14);color:#D7F0EF}
.rail-note svg{width:15px;height:15px;flex:none;color:#5FD0CD;margin-top:1px}
.rail-risk{display:flex;align-items:center;gap:10px;padding:10px;border-radius:6px;background:rgba(255,255,255,.05)}
.rail-risk>div{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.rail-risk .rscore{font-size:15px;height:28px;min-width:36px}
.rail-risk small{font-size:11px;color:#C9CED3}
.rail-risk .arrow svg{width:16px;height:16px;color:#7D858C}
.rail-foot{margin-top:auto;padding-top:12px;border-top:1px solid rgba(255,255,255,.08);color:#7D858C!important}
.sheet-main{display:flex;flex-direction:column;min-height:0;min-width:0}
.sheet-h{padding:18px 24px 14px;border-bottom:1px solid var(--line);position:relative}
.sheet-h h3{font-size:22px;font-weight:700}
.crumb-sm{font-size:11.5px;color:var(--muted);margin-bottom:3px}
.crumb-sm b{color:var(--ink-2)}
.sheet-x{position:absolute;right:14px;top:14px}
.sheet-b{flex:1;overflow-y:auto;padding:6px 24px 24px}
.sheet-f{display:flex;align-items:center;gap:8px;padding:12px 24px;border-top:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}
.fsec{padding-top:18px}

.fsec-h{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.fsec-n{font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--accent-text);background:var(--accent-soft);border-radius:4px;padding:3px 6px;line-height:1.2;flex:none}
.card-h .fsec-n{margin-right:-2px}
.fsec-h h4{font-size:16px;font-weight:600}
.fsec-h p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}

/* =================== v2: top bar user menu =================== */
.top-user-btn{display:flex;align-items:center;gap:8px;border:0;background:none;cursor:pointer;padding:4px 6px;border-radius:6px;text-align:left}
.top-user-btn:hover{background:var(--surface-2)}
.top-user-btn small{display:block;color:var(--muted);font-size:11px;line-height:1.1}
.top-user-btn .um-chev{width:12px;height:12px;transform:rotate(90deg);color:var(--muted)}
.umenu{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.18);z-index:70;min-width:220px;padding:4px;display:flex;flex-direction:column}
.umenu button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 12px;border-radius:5px;cursor:pointer;font-size:13px;text-align:left}
.umenu button:hover{background:var(--surface-2)}
.umenu svg{width:15px;height:15px;color:var(--muted)}

/* =================== v2: dashboard =================== */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) auto;gap:28px;align-items:stretch;background:var(--hero,#16191C);color:#E9ECEE;border-radius:10px;padding:24px 26px;margin-bottom:14px;position:relative;overflow:hidden;
  background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:24px 24px}
.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:repeating-linear-gradient(-45deg,var(--accent) 0 8px,var(--hero,#16191C) 8px 16px)}
.hero-eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#5FD0CD;font-weight:600}
.hero h1{font-size:34px;color:#fff;font-weight:700;margin:6px 0 12px}
.hero-lights{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:#C9CED3}
.lt{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}

.hero-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}

.hero-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#949CA3;font-weight:600}
.hero-num{font-family:var(--f-display);font-weight:800;font-size:88px;line-height:.95;color:#fff;font-variant-numeric:tabular-nums;margin:6px 0 10px}
.hero-track{position:relative;height:8px;background:rgba(255,255,255,.08);border-radius:4px}
.hero-track div{height:100%;background:var(--accent);border-radius:4px}
.hero-track span{position:absolute;top:-4px;bottom:-4px;width:2px;background:#5FD0CD}
.hero-sub{font-size:12px;color:#949CA3;margin-top:8px}
.hero-c{display:flex;flex-direction:column;gap:8px;align-items:center}
.xcross{display:grid;grid-template-columns:repeat(7,18px);grid-auto-rows:18px;gap:2px}
.xcross i{font-style:normal;font-size:8.5px;font-family:var(--f-mono);display:grid;place-items:center;border-radius:2px;color:rgba(255,255,255,.85)}
.x-void{visibility:hidden}
.x-grn{background:#2D8A4E} .x-amb{background:#C98A00} .x-red{background:#CC3A28} .x-fut{background:rgba(255,255,255,.07);color:#6B737A!important}
.x-today{outline:2px solid #fff;outline-offset:1px}
.xleg{display:flex;gap:10px;font-size:10.5px;color:#949CA3}
.xleg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.kps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kps-sm{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.kp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.kp-l{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.kp-row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.kp-v{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.05;margin-top:6px;font-variant-numeric:tabular-nums}
.kp-v small{font-size:15px;color:var(--muted);font-weight:600;margin-left:2px}
.kp-d{font-size:11.5px;margin-top:3px;color:var(--ink-2)}
.kp-d.bad{color:var(--bad)}
.spark{width:96px;height:30px;flex:none}
.sboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;padding:14px 16px}
.stile{text-align:left;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:10px 12px 10px 14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;position:relative;min-width:0}
.stile:hover{border-color:var(--ink-2)}
.stile::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0}
.st-green::before{background:var(--ok)} .st-amber::before{background:var(--warn)} .st-red::before{background:var(--bad)}
.stile-h{display:flex;align-items:center;justify-content:space-between}
.stile-lt{width:9px;height:9px;border-radius:50%}
.st-green .stile-lt{background:var(--ok)} .st-amber .stile-lt{background:var(--warn)} .st-red .stile-lt{background:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.stile-n{font-weight:600;font-size:13px;line-height:1.25}
.stile-why{font-size:11.5px;color:var(--muted)}
.st-red .stile-why{color:var(--bad)} .st-amber .stile-why{color:var(--warn)}
.stile-m{display:flex;gap:10px;font-size:11px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.stile-m b{color:var(--ink);font-family:var(--f-mono);font-weight:600}
.pbar{display:grid;grid-template-columns:130px minmax(0,1fr) 44px;gap:10px;align-items:center;padding:6px 0;cursor:pointer;font-size:12.5px}
.pbar-l{display:flex;align-items:center;gap:8px;white-space:nowrap}
.pbar-l svg{width:15px;height:15px;color:var(--muted)}
.pbar-t{display:flex;gap:2px;height:12px;background:var(--surface-2);border-radius:2px}
.pbar-t span{height:100%;border-radius:2px}
.pbar .mono{text-align:right}

/* =================== v2: assets & admin =================== */
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.acard{display:flex;gap:14px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:16px;cursor:pointer}
.acard:hover{border-color:var(--ink-2)}
.acard-ic{width:44px;height:44px;border-radius:8px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;flex:none}
.acard-ic svg{width:22px;height:22px}
.acard-b{flex:1;min-width:0}
.acard-t{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.acard-n{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.1}
.acard-chev{width:16px;height:16px;color:var(--muted)}
.acl td,.acl th{white-space:nowrap}
.acl td:first-child{white-space:normal;min-width:220px}

@media (max-width:1280px){.hero{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.hero-c{grid-column:1/-1;flex-direction:row;justify-content:flex-start;gap:20px}.kps{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){
  .lg{grid-template-columns:minmax(0,1fr)}
  .lg-brand{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:28px 0;gap:18px}
  .lg-art,.lg-slide,.lg-dots{display:none}
  .lg-stats{margin-bottom:24px}
  .sheet{grid-template-columns:minmax(0,1fr);height:calc(100% - 8px)}
  .sheet-rail{flex-direction:row;flex-wrap:wrap;align-items:center;padding:14px 16px;gap:8px 12px}
  .sheet-rail .rail-ic{width:36px;height:36px}.sheet-rail .rail-ic svg{width:18px;height:18px}
  .sheet-rail .rail-name{font-size:16px}
  .rail-kv,.rail-foot,.rail-id{display:none}
  .rail-prog{flex-basis:100%;border:0;padding:0}
  .rail-note,.rail-risk{flex-basis:100%}
}
@media (max-width:860px){
  .hero{grid-template-columns:minmax(0,1fr);padding:20px 18px 20px 22px;gap:18px}
  .hero-b{border-left:0;padding-left:0;border-top:1px solid rgba(255,255,255,.1);padding-top:16px}
  .hero-num{font-size:68px}
  .hero-c{flex-direction:column;align-items:flex-start}
  .kps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .sheet-h,.sheet-b,.sheet-f{padding-left:16px;padding-right:16px}
  #fs-req{display:none}
  .sheet-f .btn{flex:1;justify-content:center}
  .top-user-btn div,.top-user-btn .um-chev{display:none}
  .pbar{grid-template-columns:100px minmax(0,1fr) 40px}
  .lg-stats b{font-size:22px}
}

/* =================== v3: sidebar =================== */
.lg-top .brand-t{color:#fff}
.side{border-right:1px solid var(--side-line,transparent);transition:width .18s}
.nav-sub a{display:flex;align-items:center;gap:9px}
.nav-sub a svg{width:14px;height:14px;flex:none;opacity:.75}
.nav-sub{padding:2px 0 6px 22px}
.nav-sub a.active::before{display:none}
.nav-sub a.active{box-shadow:inset 2px 0 0 var(--accent)}
.nav-sub a.active svg{opacity:1;color:var(--accent)}
.nav-fly-t{display:none}
.nav-h span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-badge{margin-left:auto;background:#25D366;color:#063;font-size:11px;font-weight:700;border-radius:10px;padding:1px 7px;font-family:var(--f-mono)}
.app.collapsed{grid-template-columns:68px minmax(0,1fr)}
.app.collapsed .brand{justify-content:center;padding:14px 8px}
.app.collapsed .brand>div:last-child,.app.collapsed .nav-h span,.app.collapsed .nav-h .chev,.app.collapsed .side-foot,.app.collapsed .nav-badge{display:none}
.app.collapsed .nav-sec{font-size:0;padding:8px 0;margin:6px 14px;border-top:1px solid var(--side-line)}
.app.collapsed .nav{overflow:visible;padding:8px 10px}
.app.collapsed .side{overflow:visible;z-index:30}
.app.collapsed .nav-h{justify-content:center;padding:10px 0;position:relative}
.app.collapsed .nav-h svg{width:19px;height:19px}
.app.collapsed .nav-g{position:relative}
.app.collapsed .nav-g:hover .nav-sub,.app.collapsed .nav-g:focus-within .nav-sub{display:block;position:absolute;left:100%;top:0;margin-left:8px;width:230px;background:var(--side);border:1px solid var(--side-line);border-radius:8px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.28);z-index:50}
.app.collapsed .nav-g:hover .nav-sub::before{content:"";position:absolute;left:-10px;top:0;bottom:0;width:10px}
.app.collapsed .nav-fly-t{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--side-muted);padding:6px 10px 4px}
.app.collapsed .nav{max-height:none}
.app.collapsed .nav-g:nth-last-child(-n+6) .nav-sub{top:auto;bottom:0}
.icon-btn.menu-btn{display:inline-grid}
.top-chat{position:relative}
.tc-badge{position:absolute;top:0;right:-2px;background:#25D366;color:#053;font-size:10px;font-weight:700;border-radius:9px;padding:0 5px;font-family:var(--f-mono);line-height:16px}

/* density */
body.dense .t td{padding:6px 10px}
body.dense .t th{padding:7px 10px}
body.dense .card-h{padding:9px 14px}
body.dense .card-b{padding:10px 14px}
body.dense .content{padding-block:14px 40px}
body.dense .kp,body.dense .kpi{padding:9px 12px}
body.dense .li{padding:7px 14px}

/* =================== v3: preferences =================== */
.pref-list{display:flex;flex-direction:column;padding:4px 16px}
.pref-row{display:flex;align-items:center;gap:20px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pref-row:last-child{border-bottom:0}
.pref-l{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:2px}
.pref-l span{font-size:12px;color:var(--muted)}
.pref-c{flex:0 1 auto;min-width:0;display:flex;justify-content:flex-end}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:11.5px;cursor:pointer;min-width:84px}
.swatch i{width:44px;height:28px;border-radius:5px;display:block;position:relative;overflow:hidden}
.swatch i b{position:absolute;left:6px;top:7px;width:20px;height:5px;border-radius:2px}
.swatch.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.switch{position:relative;display:inline-block;width:42px;height:24px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;background:var(--line-2);border-radius:12px;transition:background .15s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked + span{background:var(--accent)}
.switch input:checked + span::after{transform:translateX(18px)}
.switch input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.pv{display:flex;height:120px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.pv-side{width:34px;background:var(--side);display:flex;flex-direction:column;gap:6px;padding:10px 7px}
.pv-side i{height:6px;border-radius:2px;background:var(--side-muted);opacity:.5}
.pv-side i.on{background:var(--accent);opacity:1}
.pv-main{flex:1;background:var(--bg);padding:10px;display:flex;flex-direction:column;gap:8px}
.pv-bar{height:10px;width:60%;background:var(--line-2);border-radius:2px}
.pv-row{display:flex;gap:6px}.pv-row span{flex:1;height:28px;background:var(--surface);border:1px solid var(--line);border-radius:3px}
.pv-btn{align-self:flex-start;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:600;padding:3px 8px;border-radius:3px}

/* =================== v3: manual =================== */
.man-toc{position:sticky;top:0;align-self:start;z-index:2}
@media (max-width:1024px){.man-toc{position:static}}
.man-toc a{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:5px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.man-toc a:hover{background:var(--surface-2);color:var(--ink)}
.man-toc a svg{width:15px;height:15px;color:var(--muted)}
.man-ic{width:30px;height:30px;border-radius:6px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center}
.man-ic svg{width:16px;height:16px}
.man-b{font-size:14px;line-height:1.6;max-width:75ch}
.man-b p{margin:0 0 10px}
.man-steps{margin:6px 0 10px;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.man-note{display:flex;gap:10px;padding:12px;border-radius:6px;background:var(--teal-soft);margin:6px 0 12px;font-size:13.5px}
.man-note svg{width:16px;height:16px;flex:none;color:var(--teal-text);margin-top:3px}
.man-t{margin:6px 0 12px;border:1px solid var(--line)}
.man-q{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:8px}
.man-q summary{cursor:pointer;font-weight:600}
.man-q p{margin:8px 0 0;color:var(--ink-2)}
.man-sec{scroll-margin-top:12px}

/* =================== v3: team chat =================== */
:root{--wa-bg:#EFEAE2;--wa-me:#D9FDD3;--wa-them:#FFFFFF;--wa-head:#F0F2F5;--wa-green:#25D366;--wa-dark:#008069;--wa-ink:#111B21;--wa-sub:#667781;--wa-line:#E9EDEF;--wa-tick:#53BDEB}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--wa-bg:#0B141A;--wa-me:#005C4B;--wa-them:#202C33;--wa-head:#202C33;--wa-ink:#E9EDEF;--wa-sub:#8696A0;--wa-line:#2A3942}}
:root[data-theme="dark"]{--wa-bg:#0B141A;--wa-me:#005C4B;--wa-them:#202C33;--wa-head:#202C33;--wa-ink:#E9EDEF;--wa-sub:#8696A0;--wa-line:#2A3942}
.chatw{position:fixed;top:0;right:0;bottom:0;width:min(760px,100vw);z-index:55;display:grid;grid-template-columns:290px minmax(0,1fr);background:var(--wa-head);color:var(--wa-ink);box-shadow:-20px 0 60px rgba(0,0,0,.25);transform:translateX(105%);transition:transform .22s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.chatw.open{transform:none}
.cw-list{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--wa-line);background:var(--wa-them)}
.cw-h{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--wa-head);min-height:60px;border-bottom:1px solid var(--wa-line)}
.cw-h b{display:block;font-size:15px}
.cw-h span{display:block;font-size:12px;color:var(--wa-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cw-h>div{flex:1;min-width:0}
.cw-h .icon-btn{color:var(--wa-sub)}
.cw-list>.cw-h{background:var(--wa-dark);color:#fff;border:0}
.cw-list>.cw-h span,.cw-list>.cw-h .icon-btn{color:rgba(255,255,255,.8)}
.cw-search{display:flex;align-items:center;gap:8px;margin:8px 10px;padding:6px 12px;border-radius:8px;background:var(--wa-head)}
.cw-search svg{width:15px;height:15px;color:var(--wa-sub)}
.cw-search input{border:0;background:none;outline:none;flex:1;min-width:0;color:var(--wa-ink);font-size:13px}
.cw-items{overflow-y:auto;flex:1}
.cw-item{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;padding:10px 12px;cursor:pointer;text-align:left;color:inherit;border-bottom:1px solid var(--wa-line)}
.cw-item:hover{background:var(--wa-head)}
.cw-item.on{background:var(--wa-head)}
.cw-av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:14px;flex:none}
.cw-av svg{width:20px;height:20px}
.cw-it-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cw-it-r{display:flex;align-items:center;gap:8px;min-width:0}
.cw-it-r b{flex:1;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cw-it-r small{font-size:11px;color:var(--wa-sub)}
.cw-it-r small.unr{color:var(--wa-green);font-weight:600}
.cw-prev{flex:1;font-size:12.5px;color:var(--wa-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cw-it-r em{font-style:normal;background:var(--wa-green);color:#fff;font-size:11px;font-weight:700;border-radius:10px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px}
.tick{font-style:normal;font-size:10.5px;letter-spacing:-3px;color:var(--wa-sub);margin-right:3px}
.tick.read{color:var(--wa-tick)} .tick.sent{letter-spacing:0}
.cw-thread{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--wa-bg);background-image:radial-gradient(color-mix(in srgb,var(--wa-sub) 14%,transparent) 1px,transparent 1.4px);background-size:18px 18px}
.cw-th{background:var(--wa-head)}
.cw-th .cw-av{width:38px;height:38px}
.cw-back{display:none}
.typing-t{color:var(--wa-green);font-style:normal}
.cw-msgs{flex:1;overflow-y:auto;padding:12px 6% 16px;display:flex;flex-direction:column;gap:3px}
.cw-day{text-align:center;margin:4px 0 8px}
.cw-day span{background:var(--wa-them);font-size:11.5px;padding:4px 10px;border-radius:7px;color:var(--wa-sub);box-shadow:0 1px .5px rgba(0,0,0,.13)}
.bub{max-width:78%;padding:6px 8px 4px 9px;border-radius:8px;font-size:13.5px;line-height:1.4;box-shadow:0 1px .5px rgba(0,0,0,.13);position:relative;display:flex;flex-direction:column}
.bub.them{align-self:flex-start;background:var(--wa-them)}
.bub.me{align-self:flex-end;background:var(--wa-me)}
.bub.first.them{border-top-left-radius:0;margin-top:6px}
.bub-n{font-size:12.5px;font-weight:600;margin-bottom:1px}
.bub-t{overflow-wrap:anywhere}
.bub-m{align-self:flex-end;font-size:10.5px;color:var(--wa-sub);margin-top:1px;white-space:nowrap}
.cw-card{display:flex;gap:10px;text-align:left;border:0;border-left:3px solid var(--accent);background:color-mix(in srgb,var(--wa-sub) 12%,transparent);border-radius:6px;padding:8px 10px;margin:2px 0 5px;cursor:pointer;color:inherit;font:inherit}
.cw-card>span:last-child{display:flex;flex-direction:column;gap:2px;font-size:12px;min-width:0}
.cw-card b{font-size:12.5px}
.cw-card-ic{width:30px;height:30px;border-radius:6px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;flex:none}
.cw-card-ic svg{width:16px;height:16px}
.dots{display:inline-flex;gap:3px;padding:4px 2px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--wa-sub);animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
.cw-attach{background:var(--wa-head);border-top:1px solid var(--wa-line);padding:8px 10px;display:flex;flex-direction:column;gap:2px;max-height:220px;overflow-y:auto}
.cw-attach button{display:flex;gap:10px;align-items:center;border:0;background:none;padding:7px 8px;border-radius:6px;text-align:left;cursor:pointer;color:inherit;font-size:12.5px}
.cw-attach button:hover{background:var(--wa-them)}
.cw-attach svg{width:16px;height:16px;color:var(--accent-text);flex:none}
.cw-attach span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cw-in{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--wa-head)}
.cw-in .icon-btn{color:var(--wa-sub)}.cw-in .icon-btn.on{color:var(--wa-dark)}
.cw-in input{flex:1;min-width:0;border:0;border-radius:8px;padding:10px 12px;background:var(--wa-them);color:var(--wa-ink);font-size:14px;outline:none}
.cw-send{width:40px;height:40px;border-radius:50%;border:0;background:var(--wa-dark);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.cw-send svg{width:18px;height:18px}
.cw-empty{display:grid;place-items:center;text-align:center;padding:24px}
.cw-empty>div{display:flex;flex-direction:column;align-items:center;gap:8px;max-width:280px;color:var(--wa-sub);font-size:13px}
.cw-empty svg{width:48px;height:48px;color:var(--wa-dark)}
.cw-empty b{color:var(--wa-ink);font-size:17px}
@media (max-width:760px){
  .chatw{grid-template-columns:minmax(0,1fr)}
  .cw-list.has-cur{display:none}
  .cw-list:not(.has-cur) + .cw-thread{display:none}
  .cw-back{display:inline-grid}
}
.cw-h .cw-av{display:grid}.cw-h .cw-av svg{display:block}

/* ===== v4: quick-info strip ===== */
.qs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:0 0 16px}
.qs-i{display:flex;gap:11px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0;position:relative;overflow:hidden}
.qs-i::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line-2)}
.qs-i.ok::before{background:var(--ok)}.qs-i.warn::before{background:var(--warn)}.qs-i.bad::before{background:var(--bad)}
.qs-ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--ink-2)}
.qs-ic svg{width:16px;height:16px}
.qs-i.ok .qs-ic{background:var(--ok-soft);color:var(--ok)}.qs-i.warn .qs-ic{background:var(--warn-soft);color:var(--warn)}.qs-i.bad .qs-ic{background:var(--bad-soft);color:var(--bad)}
.qs-i > div{min-width:0}
.qs-v{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Generated inspection records (seeded, deterministic) ---------- */
(function(){
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const months = ['2026-05','2026-06','2026-07','2026-08','2026-09','2026-10'];
  const stds = DB.masterData['Inspection standards'];
  const inspectors = { S01:['U01','U10'], S02:['U02','U10'], S03:['U03','U11'], S04:['U04','U11'], S05:['U05','U12'], S06:['U06','U12'], S07:['U07','U14'], S08:['U15','U10'], S09:['U16','U17'] };
  const base = { S01:88, S02:82, S03:74, S04:86, S05:91, S06:79, S07:71, S08:84, S09:89 };
  let n = 101; DB.inspections = [];
  DB.sites.forEach(s => {
    months.forEach((m, mi) => {
      stds.forEach((std, si) => {
        if (si >= 2 && rnd() < .35) return; // not every standard every month
        const day = 3 + Math.floor(rnd() * 24);
        const date = `${m}-${String(day).padStart(2,'0')}`;
        const div = DB.divisions.find(d => d.id === s.divisionId);
        const tmpl = div.type === 'Manufacturing' ? 'MFG' : 'SVC';
        const rev = DB.templates[tmpl].revisions.find(r => r.month === m).rev;
        const future = new Date(date) > TODAY;
        const score = future ? null : Math.min(100, Math.round(base[s.id] + mi * 1.2 + (rnd() * 14 - 7)));
        const findings = future ? 0 : Math.max(0, Math.round((100 - score) / 7 + rnd() * 2 - 1));
        const open = future ? 0 : (mi >= 4 ? Math.min(findings, Math.round(findings * rnd())) : 0);
        DB.inspections.push({ id:`WSI-26-${n++}`, siteId:s.id, date, standard:std, template:tmpl, rev,
          inspector: inspectors[s.id][Math.floor(rnd()*2)], score, findings, openActions:open,
          status: future ? 'Scheduled' : open > 0 ? 'Actions open' : 'Closed' });
      });
    });
  });
  DB.inspections.sort((a,b) => b.date.localeCompare(a.date));
})();

/* ---------- API facade (swap internals for backend calls later) ---------- */
const API = {
  company: id => DB.companies.find(c => c.id === id),
  division: id => DB.divisions.find(d => d.id === id),
  site: id => DB.sites.find(s => s.id === id),
  user: id => DB.users.find(u => u.id === id),
  divisionsOf: cid => DB.divisions.filter(d => d.companyId === cid),
  sitesOf: did => DB.sites.filter(s => s.divisionId === did),
  siteType: sid => API.division(API.site(sid).divisionId).type,
  /** Change the person in charge of a site. The site's email belongs to the site, so it is deliberately NOT touched. */
  changeSiteInCharge(siteId, userId, effective, reason) {
    const s = API.site(siteId), prev = API.user(s.inCharge);
    DB.inChargeHistory.filter(h => h.siteId === siteId && !h.to).forEach(h => h.to = effective);
    if (!DB.inChargeHistory.some(h => h.siteId === siteId && h.userId === prev.id)) DB.inChargeHistory.unshift({ siteId, userId:prev.id, from:s.since, to:effective });
    DB.inChargeHistory.push({ siteId, userId, from:effective, to:null, reason });
    s.inCharge = userId;
    DB.audit.unshift({ at: fmtStamp(new Date()), by:(typeof S!=='undefined'&&S.user?.name)||'Gopal Iyer', entity:`Site ${s.code}`, text:`Site in-charge changed ${prev.name} → ${API.user(userId).name}. Site email ${s.email} unchanged.` });
    return s;
  },
  templateFor(type, ymd) {
    const t = DB.templates[type]; const m = ymd.slice(0,7);
    const rev = [...t.revisions].filter(r => r.month <= m && !r.draft).pop() || t.revisions[0];
    return { ...t, current: rev };
  },
};
function fmtStamp(d){ const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }

function table(cols, rows, opts={}){
  if (!rows.length) return `<div class="empty">${opts.empty||'No records match the current filters.'}</div>`;

function revItems(type, rev){ // reconstruct a revision's checklist by undoing later changes
  const t = DB.templates[type]; let secs = t.sections.map(s => ({...s, items:s.items.map(i=>[...i])}));
  const later = t.revisions.filter(r => r.rev > rev && !r.draft).reverse();
  later.forEach(r => [...r.changes].reverse().forEach(([op,ref,txt]) => { const sec = secs.find(s=>s.id===ref[0]);
    if (op==='+') sec.items = sec.items.filter(i=>i[0]!==ref);
    if (op==='-') { sec.items.push([ref,txt]); sec.items.sort((a,b)=>a[0].localeCompare(b[0])); }
    if (op==='~') { const it = sec.items.find(i=>i[0]===ref); if (it) it[1] = txt.split(' → ')[0]; } }));
  const added = new Set((t.revisions.find(r=>r.rev===rev)?.changes||[]).filter(c=>c[0]!=='-').map(c=>c[1]));
  return secs.map(s => ({...s, items:s.items.map(i=>({ref:i[0], q:i[1], isNew:added.has(i[0])}))}));
}

function newDraft(){ const t = DB.templates[S.tmplType]; const r = { rev:t.revisions.at(-1).rev+1, month:'2026-11', effective:'2026-11-01', by:S.user?.name||'Gopal Iyer', note:'', changes:[], draft:true }; t.revisions.push(r); S.tmplRev = r.rev; render(); }
function draftSecs(type){ const t = DB.templates[type], d = t.revisions.find(r=>r.draft); const secs = revItems(type, t.revisions.filter(r=>!r.draft).pop().rev).map(s=>({...s, items:s.items.map(i=>({...i, isNew:false}))}));
  d.changes.forEach(([op,ref,txt]) => { const sec = secs.find(s=>s.id===ref[0]); if (op==='+') sec.items.push({ref,q:txt,isNew:true}); if (op==='-') { const it = sec.items.find(i=>i.ref===ref); if (it) it.removed = true; } }); return secs; }
function draftEditor(type){ const t = DB.templates[type], d = t.revisions.find(r=>r.draft);

function addDraftItem(){ const t = DB.templates[S.tmplType], d = t.revisions.find(r=>r.draft), sid = $('#dr-s').value, q = $('#dr-q').value.trim() || $('#dr-q').placeholder;
  const sec = t.sections.find(s=>s.id===sid); const used = new Set([...sec.items.map(i=>i[0]), ...d.changes.map(c=>c[1])]); let k = 1; while (used.has(sid+k)) k++;
  d.changes.push(['+', sid+k, q]); render(); }
function toggleRemove(ref){ const d = DB.templates[S.tmplType].revisions.find(r=>r.draft); const ix = d.changes.findIndex(c=>c[0]==='-'&&c[1]===ref);
  if (ix>=0) d.changes.splice(ix,1); else { const it = draftSecs(S.tmplType).flatMap(s=>s.items).find(i=>i.ref===ref); d.changes.push(['-',ref,it.q]); } render(); }

function publishDraft(){ const t = DB.templates[S.tmplType], d = t.revisions.find(r=>r.draft);
  if (!d.changes.length && !d.note) { toast('Add a note or at least one change before publishing.'); return; }
  d.changes.forEach(([op,ref,txt]) => { const sec = t.sections.find(s=>s.id===ref[0]); if (op==='+') sec.items.push([ref,txt,d.rev]); if (op==='-') sec.items = sec.items.filter(i=>i[0]!==ref); });
  if (!d.note) d.note = 'Monthly review.'; delete d.draft; S.tmplRev = d.rev; render();
  toast(`${t.code} Rev ${d.rev} published. Inspections from 1 Nov 2026 will use it; October records stay on Rev ${d.rev-1}.`); }

function fieldHtml(f){

  else if (f.t === 'textarea') ctl = `<textarea id="${id}" class="input" rows="3" placeholder="${esc(f.ph||'')}" oninput="fsSet('${f.k}',this.value)">${esc(v)}</textarea>`;

function towerArt(){ // lattice transmission tower + skyline in thin lines
  const g = []; const L = (x1,y1,x2,y2,c='currentColor',w=1) => g.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}"/>`);
  const tw = (cx, base, h, s) => { const top = base-h, bw = 34*s, tw2 = 7*s;
    L(cx-bw,base,cx-tw2,top); L(cx+bw,base,cx+tw2,top);
    for (let i=0;i<7;i++){ const y1 = base - h*i/7, y2 = base - h*(i+1)/7; const w1 = bw - (bw-tw2)*i/7, w2 = bw - (bw-tw2)*(i+1)/7; L(cx-w1,y1,cx+w2,y2); L(cx+w1,y1,cx-w2,y2); L(cx-w2,y2,cx+w2,y2); }
    [0.12,0.3].forEach((p,k) => { const y = top + h*p, a = (k?46:40)*s; L(cx-a,y,cx+a,y); L(cx-a,y,cx-tw2,y-14*s); L(cx+a,y,cx+tw2,y-14*s); L(cx-a,y,cx-a,y+16*s,'var(--accent)',1.4); L(cx+a,y,cx+a,y+16*s,'var(--accent)',1.4); });
    return [cx, top + h*0.12 + 16*s, top + h*0.3 + 16*s, (40)*s, 46*s]; };
  const a = tw(110, 300, 210, 1), b = tw(380, 300, 150, .72);
  [[a[1],b[1],a[3],b[3]],[a[2],b[2],a[4],b[4]]].forEach(([ya,yb,oa,ob]) => { [-1,1].forEach(sg => g.push(`<path d="M${a[0]+sg*oa},${ya} Q${(a[0]+b[0])/2},${Math.max(ya,yb)+28} ${b[0]+sg*ob},${yb}" fill="none" stroke="currentColor" stroke-width=".8" opacity=".7"/>`)); });
  g.push(`<path d="M0,300 H520" stroke="currentColor" stroke-width="1"/><path d="M200,300 v-46 h40 v20 l22,-12 v12 l22,-12 v12 l22,-12 v38" fill="none" stroke="currentColor" stroke-width="1"/><path d="M222,254 v-24 h8 v24" fill="none" stroke="currentColor"/>`);
  return `<svg class="lg-art" viewBox="0 0 520 310" aria-hidden="true">${g.join('')}</svg>`;
}

function spark(vals, color='var(--teal)'){ const w = 96, h = 30, mx = Math.max(...vals), mn = Math.min(...vals), rg = mx - mn || 1;
  const pts = vals.map((v,i) => [i*(w-4)/(vals.length-1)+2, h-3-(v-mn)/rg*(h-8)]);
  const d = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(''), last = pts.at(-1);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}L${last[0]},${h}L2,${h}Z" fill="${color}" opacity=".12"/><path d="${d}" fill="none" stroke="${color}" stroke-width="1.6"/><circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="${color}"/></svg>`; }
function siteHealth(id){
  const over = DB.findings.filter(f => f.siteId===id && f.status!=='Closed' && f.due < todayYmd);
  const inc = DB.incidents.filter(i => i.siteId===id && i.stage!=='Closed' && ['Major','Serious'].includes(i.sev));
  const oct = DB.inspections.filter(i => i.siteId===id && i.score!=null && i.date >= '2026-09-01'); const avg = oct.length ? Math.round(oct.reduce((s,i)=>s+i.score,0)/oct.length) : null;
  const lvl = (over.some(f=>f.risk==='High') || inc.length) ? 'red' : (over.length || (avg!=null && avg < 80)) ? 'amber' : 'green';
  const why = lvl==='red' ? (inc.length ? `${inc[0].id} under investigation` : 'High-risk action overdue') : lvl==='amber' ? (over.length ? `${over.length} action(s) overdue` : `Inspection score ${avg}%`) : 'No open issues';
  return { lvl, why, avg };
}
function safetyCross(ids){
  const inc = DB.incidents.filter(i => ids.includes(i.siteId) && i.date.startsWith('2026-10'));
  const cls = d => { const ymd = `2026-10-${String(d).padStart(2,'0')}`; if (ymd > todayYmd) return 'fut';
    const day = inc.filter(i=>i.date===ymd); if (day.some(i=>/lost time|medical|fatal/i.test(i.type))) return 'red'; if (day.some(i=>/first aid/i.test(i.type))) return 'amb'; return 'grn'; };
  let cells = '', n = 0;
  for (let r=0;r<7;r++) for (let c=0;c<7;c++){ const inCross = (c>=2&&c<=4) || (r>=2&&r<=4);
    if (!inCross) { cells += '<i class="x-void"></i>'; continue; } n++;
    cells += n<=31 ? `<i class="x-${cls(n)} ${`2026-10-${String(n).padStart(2,'0')}`===todayYmd?'x-today':''}" title="${n} Oct">${n}</i>` : '<i class="x-void"></i>'; }
  return `<div class="xcross" role="img" aria-label="October safety cross: green is injury-free, amber first aid, red recordable">${cells}</div>`;
}
function vDashboard(){

  const octInsp = DB.inspections.filter(i => ids.includes(i.siteId) && i.date.startsWith('2026-10')), done = octInsp.filter(i => i.score != null);

  const scopeName = S.scope.site ? siteName(S.scope.site) : S.scope.division ? API.division(S.scope.division).name : S.scope.company ? API.company(S.scope.company).name : 'All Voltech sites';

    <div class="hero-b"><div class="hero-lbl">Days without a lost-time injury</div><div class="hero-num">${daysNoLti}</div>
      <div class="hero-track"><div style="width:${Math.min(100,daysNoLti/365*100)}%"></div><span style="left:${212/365*100}%" title="Previous best"></span></div>

    <div class="hero-c"><div class="hero-lbl">October safety cross</div>${safetyCross(ids)}<div class="xleg"><span><i class="x-grn"></i>Injury-free</span><span><i class="x-amb"></i>First aid</span><span><i class="x-red"></i>Recordable</span></div></div>
  </section>`;

  const kp = (l, v, unit, sub, sp, tone) => `<div class="kp"><div class="kp-l">${l}</div><div class="kp-row"><div class="kp-v">${v}${unit?`<small>${unit}</small>`:''}</div>${sp}</div><div class="kp-d ${tone||''}">${sub}</div></div>`;

  const board = `<div class="card"><div class="card-h"><h3>Site status board</h3><span class="sub">Inspection, actions and incidents per site</span><div class="r"><button class="btn sm" onclick="go('site')">Site master</button></div></div>

      return `<button class="stile st-${h.lvl}" onclick="S.scope.site='${h.id}';S.scope.division='${s.divisionId}';S.scope.company='${API.division(s.divisionId).companyId}';renderScope();render()" title="Focus the dashboard on ${esc(s.name)}">

        <div class="stile-m"><span><b>${h.avg ?? '—'}</b>% insp.</span><span><b>${live}</b> permits</span><span><b>${s.manpower}</b> people</span></div></button>`; }).join('')}</div></div>`;

  const P = [['Fatality',0],['Lost time injury',1],['Medical treatment',3],['First aid',9],['Near miss',DB.incidentTrend.nearMiss.reduce((a,b)=>a+b,0)],['Unsafe acts',640]];
  const pcol = ['var(--bad)','var(--bad)','var(--accent)','var(--warn)','var(--teal)','var(--ok)'];
  let pyr = `<svg viewBox="0 0 360 212" width="100%" role="img" aria-label="Safety pyramid, last 12 months">`;
  P.forEach(([l,v],i) => { const y = 4+i*34, h = 30, w1 = 16+i*34, w2 = 16+(i+1)*34, cx = 112;
    pyr += `<path d="M${cx-w1/2},${y} L${cx+w1/2},${y} L${cx+w2/2},${y+h} L${cx-w2/2},${y+h}Z" fill="${pcol[i]}" opacity="${i<2?.92:.82}"/><text x="${cx}" y="${y+20}" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff" font-family="IBM Plex Mono,monospace">${v}</text><line x1="${cx+w2/2+6}" x2="226" y1="${y+15}" y2="${y+15}" stroke="var(--line-2)" stroke-dasharray="2 2"/><text x="232" y="${y+19}" font-size="11.5" fill="var(--ink-2)">${l}</text>`; });
  pyr += `</svg>`;

  const types = Object.entries(DB.permitTypes).map(([k,t]) => ({ t, a: permits.filter(p=>p.type===k&&p.status==='Active').length, p: permits.filter(p=>p.type===k&&['Pending approval','Approved'].includes(p.status)).length }));
  const pmax = Math.max(1, ...types.map(x=>x.a+x.p));

  const T = DB.incidentTrend, W = 560, H = 180, pl = 30, pb = 22, max = 30, bw = 13;
  const step = (W - pl - 6) / T.months.length, y = v => (H - pb) - v / max * (H - pb - 8);
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Near misses and recordable incidents per month">`;
  [0,10,20,30].forEach(t => svg += `<line x1="${pl}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" ${t?'stroke-dasharray="2 3"':''}/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${t}</text>`);
  T.months.forEach((m,i) => { const x = pl + i*step + step/2 - bw - 1;
    svg += `<g onmousemove="tip(event,'<b>${m} ${i<2?2025:2026}</b><br>Near misses: ${T.nearMiss[i]}<br>Recordable: ${T.recordable[i]}')" onmouseleave="untip()"><rect x="${pl+i*step}" y="0" width="${step}" height="${H-pb}" fill="transparent"/><path d="${bar(x, y(T.nearMiss[i]), bw, (H-pb)-y(T.nearMiss[i]))}" fill="var(--teal)"/><path d="${bar(x+bw+2, y(T.recordable[i]), bw, (H-pb)-y(T.recordable[i]))}" fill="var(--accent)"/></g><text x="${pl+i*step+step/2}" y="${H-6}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${m}</text>`; });
  svg += `</svg>`;

  const upcoming = DB.trainings.filter(t => ids.includes(t.siteId) && t.date >= todayYmd).slice(0,4);
  const lic = DB.licenses.filter(l => ids.includes(l.siteId)).map(l => ({...l, d: daysBetween(todayYmd, l.expiry)})).filter(l => l.d <= 30).sort((a,b)=>a.d-b.d);

    <div class="card"><div class="card-h"><h3>Permits by type</h3><div class="r legend"><span><i style="background:var(--accent)"></i>Active</span><span><i style="background:var(--warn-soft);outline:1px solid var(--warn)"></i>Queued</span></div></div><div class="card-b">${types.map(x=>`<div class="pbar" onclick="go('permits')"><span class="pbar-l">${icon(x.t.icon)}${x.t.short}</span><span class="pbar-t"><span style="width:${x.a/pmax*100}%;background:var(--accent)"></span><span style="width:${x.p/pmax*100}%;background:var(--warn-soft);box-shadow:inset 0 0 0 1px var(--warn)"></span></span><span class="mono small">${x.a}${x.p?` +${x.p}`:''}</span></div>`).join('')}</div></div>

    <div class="stack">
      <div class="card"><div class="card-h"><h3>Coming up</h3><div class="r"><button class="btn sm" onclick="go('tr-cal')">Calendar</button></div></div><div>
        ${upcoming.map(t => `<div class="li"><div class="date-chip"><div class="m">${MON[+t.date.slice(5,7)-1]}</div><div class="d">${+t.date.slice(8)}</div></div><div class="li-b"><div class="li-t">${esc(t.title)}</div><div class="li-s">${siteCode(t.siteId)} · ${t.planned} people · ${esc(t.trainer)}</div></div></div>`).join('') || '<div class="empty">Nothing scheduled.</div>'}</div></div>
      ${lic.length ? `<div class="card"><div class="card-h"><h3>Licences expiring</h3><span class="sub">Next 30 days</span></div><div>${lic.map(l=>`<div class="li"><div class="li-ic">${icon('doc')}</div><div class="li-b"><div class="li-t">${l.name}</div><div class="li-s">${siteCode(l.siteId)} · <span class="mono">${l.no}</span></div></div>${pill(`${l.d} days`, l.d<=7?'bad':'warn')}</div>`).join('')}</div></div>` : ''}
    </div>
  </div>`;
}

function renderNav(){

  $('#nav').innerHTML = NAV.map(n => {
    if (n.sec) return `<div class="nav-sec">${n.sec}</div>`;
    if (n.action) return `<div class="nav-g"><button class="nav-h" onclick="${n.action}" title="${n.label}">${icon(n.icon)}<span>${n.label}</span>${chatUnread()?`<b class="nav-badge">${chatUnread()}</b>`:''}</button></div>`;
    if (!n.subs) return `<div class="nav-g"><button class="nav-h ${r===n.id?'active':''}" onclick="go('${n.id}')" title="${n.label}">${icon(n.icon)}<span>${n.label}</span></button></div>`;
    const open = !col && (S.open.has(n.id) || activeGroup === n.id);
    return `<div class="nav-g ${open?'open':''}"><button class="nav-h ${activeGroup===n.id?'active':''}" aria-expanded="${open}" onclick="${col?`go('${n.subs[0][0]}')`:`toggleGroup('${n.id}')`}" title="${n.label}">${icon(n.icon)}<span>${n.label}</span>${icon('chev','chev')}</button>

  }).join('');
}

function applyPrefs(){
  const r = document.documentElement, st = SIDE_THEMES[PREF.side] || SIDE_THEMES.petrol, ac = ACCENTS[PREF.accent] || ACCENTS.orange;
  const dark = PREF.theme === 'dark' || (PREF.theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  if (PREF.theme === 'system') delete r.dataset.theme; else r.dataset.theme = PREF.theme;
  const sideVals = dark && PREF.side === 'steel' ? { side:'#151A1F', side2:'#20272D', ink:'#C9D2DA', muted:'#7D8892', strong:'#FFFFFF', line:'rgba(255,255,255,.07)' } : st;
  const set = (k,v) => r.style.setProperty(k, v);
  set('--hero', st.hero); set('--side', sideVals.side); set('--side-2', sideVals.side2); set('--side-ink', sideVals.ink); set('--side-muted', sideVals.muted); set('--side-strong', sideVals.strong); set('--side-line', sideVals.line);
  set('--accent', ac.a); set('--accent-ink', ac.ink); set('--accent-soft', dark ? ac.softD : ac.soft); set('--accent-text', dark ? ac.textD : ac.text);
  document.body.classList.toggle('dense', PREF.density === 'compact');
  document.querySelector('.app')?.classList.toggle('collapsed', !!PREF.collapsed && !matchMedia('(max-width:860px)').matches);
}

  setTimeout(()=>{ msg.st='delivered'; renderChat(); scrollChat(); }, 500);
  setTimeout(()=>{ msg.st='read'; CH.typing = true; renderChat(); scrollChat(); }, 1100);
  setTimeout(()=>{ CH.typing = false; const who = c.kind==='group' ? (c.members.split(',')[0].trim()) : c.name; c.msgs.push({ from:who, text:REPLIES[c.msgs.length % REPLIES.length], t:nowT() }); if (!CH.open || CH.cur!==c.id) c.unread++; renderChat(); scrollChat(); renderNav(); renderTopChat(); }, 2600); }
function scrollChat(){ const b = $('#cw-msgs'); if (b) b.scrollTop = b.scrollHeight; }
function sendMsg(){ const i = $('#cw-in'); const v = i.value.trim(); if (!v) return; pushMine({ text:v }); setTimeout(()=>$('#cw-in')?.focus(), 0); }

const STAT_MONTHS = ['2026-04','2026-05','2026-06','2026-07','2026-08','2026-09','2026-10'];
const HSESTATS = (() => { let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280; const out = [];
  DB.divisions.forEach(dv => { const mp = DB.sites.filter(s => s.divisionId === dv.id).reduce((a, s) => a + s.manpower, 0) || 120;
    STAT_MONTHS.slice(0, 6).forEach(m => { const direct = Math.round(mp * (0.66 + rnd()*0.08)), indirect = Math.round(mp * (0.22 + rnd()*0.06)), days = 24 + Math.round(rnd()*2);
      const lti = (dv.id === 'D01' && m === '2026-08') ? 1 : 0, nm = Math.round(2 + rnd()*mp/60);
      out.push({ company:dv.companyId, division:dv.id, month:m, indirect, direct, days, fatality:0, lti, daysLost:lti ? 12 : 0, mtc: rnd() > .8 ? 1 : 0, fa: Math.round(rnd()*3), nmOcc:nm, nmClosed: Math.max(0, nm - Math.round(rnd()*2)),
        toolbox: Math.round(days * (0.8 + rnd()*0.4)), trainings: 2 + Math.round(rnd()*4), trainees: Math.round(mp*0.18 + rnd()*20), trHours: 0, trTarget: Math.round(mp*0.6), inductions: Math.round(4 + rnd()*14), inspections: 4 + Math.round(rnd()*4), observations: Math.round(10 + rnd()*30), cas: Math.round(8 + rnd()*20), complaints: rnd() > .85 ? 1 : 0, caComplaints: 0 });
